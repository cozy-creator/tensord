// The machine's API (G/API.md): five calls on the machine's one TLS listener, whose leaf the
// client pins. Every call carries `authorization: Cozy-Cap <token>` metadata; Status may omit
// it (then it answers identity and the sealed readiness receipt only). Unknown fields are
// ignored. There are no version ranges: Status lists capabilities.
syntax = "proto3";
package cozy.machine.v1;

service Machine {
  rpc Status(StatusRequest) returns (stream StatusFrame);
  // Submits when `spec` is set and `id` is new (idempotent on id per signer), then streams the
  // run's log from `after`. Without `spec` it attaches. Closing the stream never cancels.
  rpc Run(RunRequest) returns (stream RunEvent);
  rpc Control(ControlRequest) returns (RunState);
  rpc Read(ReadRequest) returns (stream ReadFrame);
  rpc Write(stream WriteFrame) returns (WriteResult);
}

// ---- Run ---------------------------------------------------------------------------------

message RunRequest {
  string id = 1;     // the caller's run id
  uint64 after = 2;  // stream the events after this sequence
  RunSpec spec = 3;  // absent: attach to an existing run
}

enum RunKind {
  RUN_KIND_CALL = 0;
  RUN_KIND_JOB = 1;
  RUN_KIND_WARM = 2;    // prepare only: install and download, then succeed
  RUN_KIND_UPDATE = 3;  // stage, verify and activate a software cohort at idle
  // `remove/1`: the caller's installations of the source leave the machine: an installation
  // by its name, or a release's package (its release, or every release when empty) from the
  // run's Hub (local/ packages from none). Their environments are deleted once no process and
  // no other installation holds them.
  RUN_KIND_REMOVE = 4;
}

// How far a function is kept ready; each level includes the ones before it.
enum WarmLevel {
  WARM_LEVEL_UNSPECIFIED = 0;
  WARM_LEVEL_INSTALLED = 1;   // the package environment
  WARM_LEVEL_DOWNLOADED = 2;  // the function's bound weights in the store
  WARM_LEVEL_IMPORTED = 3;    // a process with its imports done: no device, no VRAM
  WARM_LEVEL_HOST = 4;        // an executor with the model constructed, weights in the host tier
  WARM_LEVEL_GPU = 5;         // its weights on the GPU
}
// One member of a caller's warm set: a function the machine keeps ready up to `level`. It is
// the last idle thing to give its memory to a request, and comes back when room returns.
message WarmItem {
  oneof source {
    Release release = 1;
    string installation = 2;
  }
  string entrypoint = 3;
  repeated ModelChoice models = 4;  // none: the owner's bindings, as for a run
  WarmLevel level = 5;
  // Status only: the level it holds now (installed, downloaded, imported, host, gpu) and why
  // that is lower than `level`.
  string holds = 6;
  string held_back = 7;
}
message WarmSet {
  repeated WarmItem items = 1;
}

message RunSpec {
  RunKind kind = 1;
  oneof source {
    Release release = 2;
    string installation = 3;  // one this machine already holds for the signer
    LocalSource local = 4;
  }
  string entrypoint = 6;
  bytes payload = 7;              // canonical JSON object of the function's parameters
  repeated InputFile inputs = 8;  // objects uploaded with Write, bound to payload fields
  repeated ModelChoice models = 9;
  // The catalog revision the caller made its choices under (th-245): a held resolution is reused
  // only under the same one, so a publish, yank, bind or retarget the caller knows of resolves
  // once more at the Hub.
  string catalog_revision = 10;
  reserved 11;  // known results: memos are the machine's own
  string attention_kernel = 12;
  string weights_destination = 13;  // org/name: a job's weights outputs, or a warm run's source model
  HubAccess hub = 14;               // where the run reads, and its capability there
  string owner = 15;                // the account that org-relative references of local code name
  ProviderAccess providers = 16;    // provider tokens for source models, memory only like hub
  reserved 17, 19;  // publication authorizations: the capability names a publication
  // RUN_KIND_WARM (`warm/2`): the caller's whole warm set, replacing its previous one; no items
  // clears it. The run installs and downloads every member, and its result lists each one's
  // `level` and `held_back`. Absent: the set is left as it is.
  WarmSet set = 18;
}

// The caller's provider tokens, for models a run makes from a provider source.
message ProviderAccess {
  string huggingface = 1;
  string civitai = 2;
}

// A published release by name (th-245): a machine that holds no installation of it reads its
// card and locked requirements at the Hub by name.
message Release {
  string package = 1;  // org/name
  string release = 2;  // empty: the Hub's newest
  reserved 3, 4, 5;    // the card and lock the caller once carried
}
// The manifest is a JSON object written with Write: {package: "local/<dist>", release,
// python_requires, python_version, source: {digest, length} (a tar of the project),
// wheels: [{name, digest, length}], requirements: {digest, length}}. Its members are objects
// the same signer wrote.
message LocalSource {
  string manifest = 1;  // sha256:<hex> of the manifest object
}
message InputFile {
  string field = 1;   // the payload field path, list index included
  string digest = 2;  // sha256:<hex>
  uint64 length = 3;
  string media_type = 4;
  uint32 order = 5;
}
// One model slot's choice, by name (th-245: the machine resolves it at the Hub). A Hub model is
// `repository` at `release` (empty: the newest) in `lane`, else the widest rung of `rungs` its GPUs
// fit, else the release's only lane. `manifest` names a checkpoint by hash only: the owner's
// private one at the Hub (with `repository`; the run's capability names it) or one this machine
// holds (without). The caller sends one for every model slot the run may load, a callee's
// included (`<package>/<path>`).
message ModelChoice {
  string parameter = 1;  // a root slot parameter or full slot path
  string repository = 2;
  string release = 3;
  string lane = 4;
  string manifest = 5;   // sha256:<hex>
  uint64 manifest_length = 6;
  repeated Adapter adapters = 7;  // each by name, a hash of the owner's, or a provider source
  // A provider source (hf://<org>/<repo>@<rev>[/member], civitai://<version>[/file]) the
  // machine makes the slot's model from, under these reviewed profiles (none: the one its
  // headers select); never with repository or manifest.
  string source = 8;
  repeated string profiles = 9;
  repeated ModelRung rungs = 10;
}
// One rung of a binding: on GPUs matching `gpu`, `gpus` of them run the slot's `lane`.
message ModelRung {
  string gpu = 1;       // "*", or the tokens a GPU name contains, in order ("h100", "rtx 5090")
  uint32 gpus = 2;
  string lane = 3;
  reserved 4, 5;        // the rung's checkpoint: the machine resolves the lane by name
}
message Adapter {
  string component = 1;
  string model = 2;
  string release = 3;
  string lane = 4;
  string manifest = 5;  // sha256:<hex>, the owner's checkpoint by hash; else model at release, lane
  string scale = 6;  // canonical decimal; empty means 1
  // A provider source (civitai://<version>, hf://…) made here and normalized at ingest,
  // under these reviewed profiles (none: the one its headers select); never with model.
  string source = 7;
  repeated string profiles = 8;
}
// A Hub a run reads. Public content is read anonymously.
message HubAccess {
  string origin = 1;
  reserved 2, 3, 6;      // bearer token, expiry, authorization code
  bytes ca_der = 4;      // an origin's private CA, when it has one
  repeated string object_hosts = 5;  // the Hub's object-storage hosts downloads may follow
  // The owner's capability for this run's private operations (th-241): a compact JWS its
  // device key signed for this machine's leaf (`cnf.jkt`) and the Hub's resource (`aud`),
  // naming each operation in `authorization_details`. The machine trades it once, at the
  // run's first private operation, at `token_endpoint` (AuthKit's JWT-bearer grant). Empty:
  // a public-only run.
  string capability = 7;
  string token_endpoint = 8;  // the Hub's authorization server's, as its metadata names it
}

message RunEvent {
  reserved 8;  // memo records: memos are the machine's own
  uint64 sequence = 1;  // 0: a preparation progress frame before the run is accepted
  int64 at_ms = 2;
  oneof event {
    RunState state = 3;
    Progress progress = 4;
    Product product = 5;
    LogLine log = 6;
    Outcome outcome = 7;
    Call call = 9;
  }
}
message RunState {
  string id = 1;
  uint64 number = 2;   // this machine's run number
  string state = 3;    // queued, preparing, running, paused, succeeded, failed, canceled
  uint64 sequence = 4; // the log's head
  uint32 attempt = 5;
  string waiting = 6;  // why a queued run waits, for people
}
message Progress {
  string stage = 1;
  double fraction = 2;  // -1: unknown
  uint64 completed = 3;
  uint64 total = 4;
  uint64 bytes_done = 5;
  uint64 bytes_total = 6;
  double step_ms = 7;   // the latest step's time, while a stage steps
  optional double stage_fraction = 8;  // how far this stage is, when it says
}
// One revision of an output: a single output is replaced by each, a list output grows.
message Product {
  string output = 1;
  uint32 index = 2;  // a list item's 1-based index; 0 for a single output
  uint64 rev = 3;
  uint64 length = 4;
  string digest = 5; // sha256:<hex> of these bytes
  string media_type = 6;
  string label = 7;
  uint64 duration_us = 8;  // media time, for a growing video
  optional uint64 appended_from = 9;  // these bytes extend the previous revision's, from here
}
message LogLine {
  string level = 1;
  string text = 2;
}
message Outcome {
  string status = 1;  // succeeded, failed, canceled
  Reason reason = 2;
  bytes result = 3;   // the result's canonical JSON, assets as digests
  repeated Product outputs = 4;
  bool triage = 5;    // Read{triage} answers its bundle
  // What its executor measured, as canonical JSON: `attribution` (stage and step tracks),
  // `execution` (degree, ranks with the GPU and attention each served, executor boot,
  // construction load and warm) and `observations` (attention rows, Sol's dense and sparse
  // calls among them). Empty for a run that ran on no device.
  bytes measurements = 6;
  uint64 execution_ms = 7;  // its own time running its callable, every attempt summed; 0: unknown
}
message Reason {
  string code = 1;
  string message = 2;
  string origin = 3;  // request, runtime, author, machine
}
// One settled call the run made: a child run, or an effect such as its weights publication.
message Call {
  string run = 1;           // the child run's id
  uint32 index = 2;         // its index among the run's calls
  string function = 3;
  string label = 4;         // the author's label for it
  string status = 5;        // succeeded, failed, canceled
  int64 called_at_ms = 6;
  int64 finished_at_ms = 7;
  bytes measurements = 8;   // its executor's, as canonical JSON (Outcome.measurements)
  Reason reason = 9;        // why it did not succeed
  bool memoized = 10;       // answered from a result this machine held; nothing ran
  string computation_digest = 11;  // a memoized call's computation (sha256:<hex>), ran or answered
}

// ---- Control -----------------------------------------------------------------------------

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_CANCEL = 1;
  ACTION_PAUSE = 2;
  ACTION_RESUME = 3;
}
message ControlRequest {
  string id = 1;
  Action action = 2;
}

// ---- Read --------------------------------------------------------------------------------

message ReadRequest {
  oneof target {
    OutputTarget output = 1;
    string triage = 2;  // a run id
    string log = 3;     // a machine log's name
  }
  uint64 offset = 4;
  uint64 if_rev = 5;  // nonzero: refuse (FAILED_PRECONDITION) unless the output is at this rev
  uint64 tail = 6;    // a log's newest bytes, from a line start
}
message OutputTarget {
  string run = 1;
  string output = 2;
  uint32 index = 3;  // a list item's 1-based index; 0 for a single output
  string member = 4; // one file of a tree output, by its manifest path; empty: the manifest
}
// The first frame describes the bytes (data may be empty); the rest carry data in order.
message ReadFrame {
  uint64 rev = 1;
  uint64 length = 2;
  string digest = 3;  // sha256:<hex>, once the output is final
  string media_type = 4;
  bytes data = 5;
}

// ---- Status (D2) -------------------------------------------------------------------------

// Without a machine-scope cap Status answers one frame (identity and the sealed receipt) and
// ends. With one it streams: each frame is the whole picture, sent again when it changes. An
// open Status stream is not activity; `keepalive` resets the idle deadline once and the first
// frame carries the new deadline.
message StatusRequest {
  bool keepalive = 1;
}
message StatusFrame {
  string worker_id = 1;
  string boot_id = 2;
  string version = 3;               // this machine's release
  repeated string capabilities = 4;
  bytes receipt = 5;                // the sealed readiness envelope; empty until sealed
  int64 idle_deadline_unix_ms = 6;  // a rental's release, 15 min after its last job; 0: never
  repeated RunState runs = 7;       // the caller's live runs
  string phase = 8;                 // booting, ready, releasing
  string platform = 9;              // os/arch
  int64 started_at_unix_ms = 10;
  repeated Gpu gpus = 11;           // measured at boot
  repeated Hub hubs = 12;
  string runtime = 13;              // the executors' cozy-runtime
  string tensorfs = 14;
  repeated Environment environments = 15;  // the caller's held package installations
  Disk disk = 16;                   // the filesystem holding the machine's store
  repeated Model models = 17;       // the models the machine's store holds
  uint64 models_bytes = 18;         // their bytes together, shared content counted once
  WebRTC webrtc = 19;               // the direct player endpoint, when the machine listens
  repeated WarmItem warm = 20;      // the caller's warm set, each with what it holds now
}
message WebRTC {
  uint32 port = 1;                  // the listener; a persistent machine keeps it across restarts
  repeated string addresses = 2;    // host:port to dial: own interfaces, or the provider's mapping
  string fingerprint = 3;           // SHA-256 hex of the certificate its DTLS presents
  string unavailable_reason = 4;    // why no address is reported (a malformed mapping)
}
message Model {
  string repository = 1;            // org/name; org "local" is a local alias
  uint64 total_bytes = 2;           // everything this repository reaches
  uint64 unique_bytes = 3;          // reached by no other held repository
  repeated Checkpoint checkpoints = 4;
}
message Checkpoint {
  string release = 1;               // empty for a local alias
  string lane = 2;
  string manifest = 3;              // sha256:<hex>
  bool yanked = 4;
}
message Gpu {
  uint32 index = 1;
  string name = 2;
  string uuid = 3;
  string pci_bus_id = 4;
  uint64 memory_bytes = 5;
  string driver = 6;
}
message Hub {
  string origin = 1;
  string machine_id = 2;  // this machine's worker id there
}
message Environment {
  string installation = 1;  // RunSpec.installation names it
  string package = 2;
  string release = 3;
  repeated string entrypoints = 4;
  string runtime = 5;       // the cozy-runtime installed in it
  string level = 6;         // what it holds now (as WarmItem.holds), in a warm set or not
  string warning = 7;       // why it does not run the machine's own Runtime; empty when it does
  string hub = 8;           // the Hub origin a published installation came from; empty for local code
}
message Disk {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
}

// ---- Write (D1) --------------------------------------------------------------------------

// The first frame names the object; frames carry its bytes from `offset` (the length the
// machine already holds, from WriteResult or a previous attempt).
message WriteFrame {
  string digest = 1;  // sha256:<hex>
  uint64 length = 2;
  uint64 offset = 3;
  bytes data = 4;
}
message WriteResult {
  string digest = 1;
  uint64 held = 2;  // bytes held; equal to length once complete
}
