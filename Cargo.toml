[package]
name = "cozy-machine"
version = "0.1.0+dev.outputcapacity.0599a77"
edition = "2021"
publish = false

[dependencies]
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tensorfs-core = { git = "https://github.com/cozy-creator/tensorfs.git", rev = "d0fb67012679c0ffc7e22bcff4ccea806b211254" }
tensorfs-plane = { git = "https://github.com/cozy-creator/tensorfs.git", rev = "d0fb67012679c0ffc7e22bcff4ccea806b211254" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_json_canonicalizer = "0.3"
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.31.3", default-features = false, features = ["fs", "socket", "uio", "user", "signal", "process", "net"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
webpki-roots = "1"
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
prost = "0.14"
axum = "0.8"
ed25519-dalek = "2"
rcgen = { version = "0.14", features = ["pem", "ring"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
blake2 = "0.10"
png = "0.17"
image-webp = "0.2"
tar = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
time = "0.3"

[dev-dependencies]
x509-parser = "0.18"

[build-dependencies]
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3"
zip = { version = "7", default-features = false }
sha2 = "0.10"
base64 = "0.22"
