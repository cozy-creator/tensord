[project]
name = "native-output-capacity-proof"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.19.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["capacity_proof.py"]
[tool.cozy]
app = "capacity_proof:app"
