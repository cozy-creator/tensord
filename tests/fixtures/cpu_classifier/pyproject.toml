[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "cozy-machine-cpu-classifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime>=0.18.89,<0.18.101",
    "msgspec>=0.19,<1",
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
]

[project.entry-points."cozy.application"]
default = "cpu_classifier:app"

[tool.uv.build-backend]
module-name = "cpu_classifier"
module-root = ""
