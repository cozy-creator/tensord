  CAUSE_ORIGIN_UNSPECIFIED = 0;
  CAUSE_ORIGIN_AUTHOR = 1;
  CAUSE_ORIGIN_RUNTIME = 2;
  CAUSE_ORIGIN_EXECUTOR = 3;
  CAUSE_ORIGIN_WORKER = 4;
