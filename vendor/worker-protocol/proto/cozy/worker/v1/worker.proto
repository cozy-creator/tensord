// A machine reads a package at its own Hub once and keeps the answer: its newest release, and
// each installation's Model resolutions (the owner's bindings, each lane's checkpoint). A warm
// run reads nothing. The owner's rebinding or new release is the change it cannot see, so the
// controller that made it names the package here.
message ForgetPackageCall {
  Claim claim = 1;
  string package = 2; // org/name
}
message ForgetPackageResult {}

// A NativeArtifactTransfer over the machine connection. The claim authorizes it; the
// command's epoch and stream fields are unused there.
message NativeArtifactTransferCall {
  Claim claim = 1;
  NativeArtifactTransfer request = 2;
}

// A claimed owner may inspect/upload objects only inside its independently
// retained native artifact. No package attempt, author path or raw object inventory
// is manufactured. Inventory is computed from the exact native manifest closure.
message NativeArtifactTransfer {
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string effect_id = 4;
  DerivedRetentionRequest source = 5;
  Ref manifest = 6;
  uint64 command_id = 7;
  uint32 offset = 8; // inventory page, no payload offset
  uint32 limit = 9; // inventory page <=128
  WeightsUploadGrant grant = 10; // absent means inventory, present means one object upload
  uint64 grant_revision = 11;
  int64 server_time_unix = 12; // grant signer's clock for relative expiry validation
  // Exactly one of source and byte_source is present. The manifest above
  // must equal byte_source.source.manifest; ordinary files are never CozyTensors.
  NativeByteRetentionRequest byte_source = 13;
}
message NativeArtifactTransferStatus {
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string effect_id = 4;
  DerivedRetentionRequest source = 5;
  Ref manifest = 6;
  uint64 command_id = 7;
  repeated WeightsObjectRef objects = 8; // sorted verified native closure page, <=128
  uint32 next_offset = 9;
  bool has_more = 10;
  bytes closure_digest = 11; // canonical ordered object-ID/length inventory
  string object_id = 12;
  uint64 grant_revision = 13;
  WeightsUploadOutcome outcome = 14;
  uint64 transferred_bytes = 15;
  string checksum_sha256 = 16;
  uint32 http_status = 17;
  string safe_code = 18;
  string safe_detail = 19;
  NativeByteRetentionRequest byte_source = 20; // exact echoed ordinary-tree source
}

// A native ordinary-file tree. The receipt identifies its original producer
// root even when the currently held donor is an independent recipient/cache root.
// FileAsset outputs use the single member "payload"; Tree outputs use their actual
// ordinary-file manifest. content_bytes is capacity, NEVER manifest byte length.
message NativeByteTreeRef {
  string producer_root_id = 1; // exact sha256:<hex> native producer root identity
  bytes receipt_digest = 2;   // SHA-256 of the actual immutable native receipt
  Ref manifest = 3;
  uint64 content_bytes = 4;
}

message NativeByteRetentionRequest {
  NativeByteTreeRef source = 1;
  string retention_id = 2; // exact sha256:<hex>; immutable consumer obligation
}
message NativeByteRetentionCall {
  Claim claim = 1;
  NativeByteRetentionRequest request = 2;
}
message NativeByteRetentionResult {
  NativeByteTreeRef source = 1;
  string retention_id = 2;
  bool released = 3;
}

// The surrounding ChildCallResult owns recipient request/ordinal/spec/call/intent.
// output_id names a declared result field, or the explicitly requested capture slot.
message ChildByteResultGrant {
  string output_id = 1;
  NativeByteTreeRef source = 2;
  string retention_id = 3;
}

// Payloads use a dedicated data RPC, never WorkerControl. The claimed owner must
// hold this exact native retention; object must be a verified member of its closure.
// A receiver verifies contiguous offsets, exact requested length and final SHA-256.
// One root input file/tree. The canonical native file manifest is the
// complete object authority, not a caller-authored path list beside it. Exactly
// one header comes first and one commit last. Each declared unique object is sent
// in contiguous chunks; a disconnected object restarts (no offset resume promise).
// Runtime validates capacity and native-commits the full closure before replying.
// Header replay is bound to owner/request/input_id/manifest/content_bytes; a
// changed subject refuses. Root acceptance acquires its own semantic recipient
// before the intake recipient can be released. No producer attempt is invented.
message InputTreeImportHeader {
  Claim claim = 1;
  string request_id = 2; // existing root request, <=128 printable bytes
  string input_id = 3; // exact typed input field, <=1024 bytes
  Ref manifest = 4;
  bytes manifest_canonical_bytes = 5; // <= MaxInputTreeManifestBytes
  uint64 content_bytes = 6; // sum of file lengths; Runtime owns admission capacity
}
message InputTreeImportBlob {
  Ref object = 1; // exact declared blob; duplicate complete objects need not be repeated
  uint64 offset = 2; // contiguous within this stream, starts at zero for each object
  bytes data = 3; // <= MaxInputTreeChunkBytes; empty only for a declared empty object
}
message InputTreeImportCommit {
  // Fence this exact intake permanently. No objects are required. Reconciles a
  // native commit that beat the abort, then releases only the intake recipient.
  // The result has released=true; source is absent if no native commit occurred.
  bool abort = 1;
}
message InputTreeImportFrame {
  oneof body {
    InputTreeImportHeader header = 1;
    InputTreeImportBlob blob = 2;
    InputTreeImportCommit commit = 3;
  }
}

message NativeByteReadCall {
  Claim claim = 1;
  NativeByteRetentionRequest source = 2;
  Ref object = 3;
  uint64 offset = 4; // bounded by object.length; exact suffix read for interrupted I/O
}
message NativeByteReadChunk {
  uint64 offset = 1;
  bytes data = 2; // nonempty, <=MaxNativeByteReadChunkBytes
}

// cr-113 request option: never part of a package's payload or interface.
message ActivationCapture {
  repeated string components = 1; // nonempty, unique declared component names
  repeated uint32 steps = 2; // ascending unique, includes 0; empty means the complete schedule
}

// Observed facts from this attempt's worker/executor, never copied from a lane promise.
message ExecutionEnvironment {
  string runtime_version = 1;
  bytes worker_image_digest = 2; // absent for a local process with no image identity
  string accelerator = 3; // actual accelerator model, or CPU for CPU execution
  string driver = 4;
  string cuda = 5;
  string worker_boot_id = 6;
  string execution_lane = 7; // eager or compiled, only when observed
  bytes execution_contract_digest = 8; // absent on a contract-less execution
  string kernel_symbol = 9; // actual cr-109 attestation; empty without an observation
}

message ActivationCaptureResult {
  string output_id = 1; // reserved runtime.capture; exact OutputEntry/parent grant lookup
  bytes content_digest = 2; // SHA256(capture.json || sketches.f32), NOT the Tree manifest
}

message ExecutionObservation {
  ExecutionEnvironment environment = 1;
  ActivationCaptureResult capture = 2;
}

// RuntimeRevision is the image-owned Runtime/TensorFS software revision a worker should
// converge to. It is metadata only: the desired state never carries wheel bytes or URLs.
// The outer DesiredWorkerState.revision is the monotone fence and the worker must persist
// this nested document before it acknowledges that desired revision.
message RuntimeRevision {
  bytes wheel_digest = 1;       // SHA-256, exactly 32 bytes
  uint64 wheel_length = 2;      // bounded before staging
  string runtime_version = 3;   // normalized cozy-runtime distribution version
  string python_abi = 4;        // cpNNN, matched to the immutable base image
  bytes provenance_digest = 5;  // canonical build/provenance record digest
  string channel = 6;           // development or production
}
