// cozy.worker.v1 — the RecordOwner<->worker wire contract. Schema only; no behavior.
//
// Authority: tracker-v2/worker-protocol/01-wire-schema.md (schema laws), 02-lifecycle.md
// (behavior), 03-versioning-conformance.md (versioning), rev-2-dynamic-serving.md (THIS
// revision). Issue: tracker/tensorhub/th-024.
//
// ORIENTATION: the WORKER (cozy-runtime's torch-free machine control process) HOSTS this
// service; the RECORDOWNER (the Cozy daemon, a pod's PodRecordOwner, or a
// tensorhub orchestrator-shard via th-007) DIALS it. The orientation is IDENTICAL local and
// remote; only channel establishment differs: a Unix socket (Windows: loopback) co-resident,
// TLS over a private network or authenticated overlay remotely. A worker control port is NEVER
// required to be publicly exposed for topology symmetry.
//
// VERSIONING: the MAJOR is the package path (`cozy.worker.v1`). The MINOR is `wire_minor`, a
// release train number. Each peer advertises its [minimum_wire_minor, wire_minor] range through
// ProtocolInfo, and its Claim carries its minor. Claim, ProtocolInfo, status, snapshots,
// keepalive, release and cancellation are never refused over a wire minor. Preparation and
// execution need the peer at or above WIRE_MINIMUM; below it only that operation fails with
// `capability_unavailable`, naming the component to update, and other work and rentals continue.
// Components release independently. An additive change raises WIRE_MINOR alone; a sender relying
// on it checks the peer's minor or a capability and falls back when the peer lacks it, and a peer
// without a new RPC answers UNIMPLEMENTED for that call only. WIRE_MINIMUM is the oldest deployed
// peer's minor: it rises only after a stated deprecation window, once no deployed peer still
// sends or reads what is removed, and never to equal WIRE_MINOR. After the v1 freeze, breaking
// changes need a new major.
// R7 IS AN AUTHORING RULE ONLY: `reserved` numbers and names are compiler-enforced
// tombstones against reuse; ordinary proto3 decoders do not refuse them on the wire and no
// runtime polices them. All generated bindings and fixtures move together.
//
// IDENTITY IS CANONICAL BYTES, PROTOBUF IS TRANSPORT: no digest is ever computed over
// protobuf-marshaled bytes. A meaning-fencing digest is the SHA-256 of a DOCUMENT's exact
// canonical bytes (RFC 8785-shaped canonical JSON under tfs-013's writer). Where the fence
// requires byte agreement the canonical bytes travel IN the message as a `bytes` field instead
// of a structured body; the receiver recomputes sha256 over the resident bytes BEFORE parsing a
// single field. DIGEST CLASSES: (a) document identity over canonical JSON bytes; (b) content
// digest over opaque artifact bytes. On the wire a class-(a)/(b) digest is raw 32-byte `bytes`;
// inside a canonical document the same digest is spelled `"sha256:<64 lowercase hex>"`.
// BYTES NAMING LAW: a `bytes` field named `digest`, `*_digest`, or repeated `*_digests` IS a
// 32-byte SHA-256; every other `bytes` field is an opaque payload (base64 in documents).
//
// THE CONTROL STREAM CARRIES CONTROL, NOT CONTENT. No frame moves an object's bytes. Every
// content-bearing field is bounded by a constant, and every one of those constants is <=
// `MaxInlineControlBytes` (4 MiB) PER TRANSFER -- not per chunk. The distinction is the whole
// rule: a 4 MiB frame is fine, and a 4 MiB frame sent 2,048 times to move 8 GiB is the defect,
// because the total it moves is bounded by nothing. Anything larger than the ceiling travels
// as a presigned URL to the process that holds the bytes, which is what `WeightsUploadGrant`
// and `DeliveryGrant.outputs` already do.
//
// The rule has NO carve-out and is mechanically enforced on the BOUND: tensorhub's
// `scripts/fence.py` convicts any content-bearing `Max*Bytes` constant above the ceiling,
// whatever the field carrying it is called. th-094 retired the last exemption, local package
// upload, which moved 1 GiB in 1 MiB frames.
//
// DOCUMENT VERSIONS. The canonical `format` tag is the message's full name plus `/N`. A reader
// verifies the digest over the carried bytes and their canonical encoding, then reads only the
// fields it consumes: an unknown key is IGNORED and an absent key means its default (an absent
// collection is empty). A key whose omission would change results is a capability: senders
// include it only for peers that advertise it, so ignoring an unknown key is always safe. A
// reader never re-serializes a parsed document to compare identities. `/N` changes only when a
// consumed field is removed or retyped.
//
// THE ENVELOPE (every message, fields 1-3): the ownership + boot fence, checked BEFORE any body
// field is read, in this order:
//   1 `record_owner_epoch`     - durable monotonic AUTHORITY epoch, minted by whatever
//                                grants ownership. Older than the accepted claim => dropped.
//   2 `control_stream_epoch`   - worker-minted, incremented for EVERY accepted control
//                                stream; a frame from a superseded stream is dropped.
//   3 `worker_boot_id`         - minted at worker-process boot, never reused; a frame
//                                addressed to a dead boot is dropped. An id, not an epoch:
//                                it need only DIFFER, never be greater.
// FIELD 4 IS RESERVED IN EVERY MESSAGE (#446): the old global `executor_incarnation` is GONE.
// The worker BOOT id is machine truth; each placement's EXECUTOR epoch is placement truth
// (`PlacementStatus.executor_epoch`) and rides attempt-scoped facts, not the envelope. The
// attempt fence triple is (request_id, attempt_ordinal, invocation_spec_digest).
//
// PLACEMENTS (#481; renamed from DEPLOYMENTS — tensorhub's "deployment" is an id-less semantic
// tuple and the collision was real). `placement_id` is the RecordOwner-minted routing + journal
// key for one hosted assignment. A placement's fully resolved immutable definition lives directly
// inside PlacementSet. Its identity is `(placement_set_digest, placement_id)`; there is no
// independent PlacementSpec document or digest. The worker never resolves a mutable release id,
// so two workers handed the same set converge to the same bytes or fault typed. One placement
// per package; a placement holds every construction its slots bind.
//
// TWO AXES, NOT ONE ENUM (#473/#482): a placement's convergence is MaterializationState x
// ServingState. A single phase cannot represent staged-on-disk x draining independently, which
// is exactly the state an outgoing spec holds under fallback-retention (#474). Machine
// lifecycle is `WorkerPhase`, pulled out of the placement enum; the old `IntakeState` is retired
// with both of its uses. "prepared"/"warming"/"ready" are retired as state words.
//
// ONE ADMISSION GATE (#472e/#482/#486c): per-placement `attempt_credits` are DELETED — N
// counters over ONE serialized device advertise N x the real capacity, and the defect is
// arithmetic. Execution capacity is a WORKER property (`admission_epoch` +
// `admission_state` + `available_attempt_slots`); dispatchability is a PLACEMENT property (the
// serving axis + dispatchable_binding_digests). Only `admission_epoch` FENCES; the other two are
// the GATE — "not accepting" / "full" — not a fence against a stale actor. Per-placement
// `readiness_epoch` is DELETED, not renamed: one fence, not two to keep consistent.
//
// EVERY OFFER GETS A JOURNALED OUTCOME (#472f/#480b): an AttemptOffer receives either
// AttemptAccepted or a JOURNALED AttemptOutcome(REFUSED) — never silence and never an
// unjournaled decline (there is no AttemptDeclined message to add). A pre-execution refusal
// consumes the attempt_ordinal and zero billed execution budget; the billing fact is the
// STRUCTURAL bit AttemptOutcomeBody.execution_started, never a cause-code allowlist.
//
// ONEOF-LAST RULE (transport determinism only, never identity): every oneof carries the highest
// field numbers in its message.
//
// ENUM VALUE NAMING: every value is prefixed with its enum's SCREAMING_SNAKE type name. proto3
// scopes enum values at PACKAGE level, so the unprefixed spellings in the rev document
// (OPEN/FAILED/DRAINING/OFFLINE) would collide across MaterializationState, ServingState,
// WorkerPhase and AdmissionState and fail to compile. NUMBERS are the normative part.
//
// THINNING ("no writer, no field"): the purge lane is a reservation — private-artifact purge
// (cr-013/tfs-014, post-M9) rides Control as a durable command/acknowledgement pair when it
// lands, holding oneof slot 14 on both frames. `AppliedAdapter` (cr-010) and `DrainPolicy`
// (th-007) stay reservations. The retired desired-state artifact delegation remains absent;
// ArtifactSink host durability and transfers instead use the explicit host-only frames below.
//
// THE HOST APPENDS, NEVER RE-AUTHORS (proto-025). A pod's supervisor is the
// pod-resident half of the HOST role the Cozy daemon performs in-process locally: it downloads
// and verifies, asks the Runtime's loopback preparation for PlacementSet bytes, moves objects,
// and keeps the pod ledger. That role has its own lanes so the host never rewrites
// a frame in flight: `PodHost` (owner <-> host, a second service on the pod listener),
// `RuntimeWeights` (host <-> Runtime, loopback), and a host-authored SECOND snapshot document
// beside the worker's, which passes through BYTE-IDENTICAL. The owner's transfer lanes
// (weights transfer, model source files and preparation, local package abort) still
// ride RecordOwnerFrame / WorkerFrame slots on WorkerControl, which the Host routes itself.
//
// DEVICE LANES (proto-024). The serialized resource inside one worker is a DEVICE
// LANE — a set of envelope-local device ordinals, one attempt seat, one ledger — not the worker
// (cr-066). The one-counter-per-serialized-resource principle behind the admission gate (#472e)
// therefore puts the seats PER LANE: `ObservedWorkerState.lanes[]`, with the worker-level
// `available_attempt_slots` provably their sum. A lane carries K >= 1 ordinals. K == 1 is every
// worker shipped so far and is byte-identical on the wire but for the new repeated field. K > 1
// is a GROUP lane: ONE executor sealed to all K devices (cr-018's sequence-parallel door:
// `gpu_count` is never request concurrency). The
// RecordOwner ASSIGNS a group by pinning a placement to K ordinals (`DesiredPlacementSet.
// device_pins`, beside the digest-fenced document, never inside it: where a placement sits on
// THIS worker is not part of what it serves); the worker validates the pin against its envelope
// and the package's declared construction and refuses typed. `PlacementStatus.device_lane_id`
// reports the lane a placement landed on. Nothing at 22 is removed or renumbered.
//
// THE ATTEMPT QUEUE (proto-026; gpu-hot.md §3-§6). The worker ORDERS its lane; the
// RecordOwner OFFERS depth. Acceptance is queue ADMISSION — journaled, hydrated, queued on a
// lane — and binds neither a plan nor an executor epoch: both bind at DEVICE ENTRY. An attempt
// on a lane is QUEUED -> RUNNING -> DEVICE_RELEASED -> OUTCOME_PENDING_ACK; the device seat is
// the RUNNING held attempt on the lane, never a count, and the post phase (encode, digest,
// write, outcome) runs beside the next occupant. Every accepted attempt appears in
// `held_attempts` from admission to ack with its lane, worker order, overtake count and budget
// (`HeldAttempt` 10-14); `DeviceLane.available_attempt_slots` becomes the offers the lane will
// still ADMIT TO ITS QUEUE now; `AttemptMetrics.post_ms` and an honest `device_lease_ms` split
// the two phases. `admission_epoch` no longer bumps on executor respawn: a queued attempt is
// bound to no executor. The four `AttemptAccepted` slots that bound plan and epoch at
// acceptance (8, 9, 10, 12) are RESERVED — a PRE-LAUNCH HARD CUT, no dual reading, no shim; an
// owner below 23 is below the floor. RESIDENCY
// (residency-aware-routing.md §2/§6, same minor): two observed SETS cross the wire and nothing
// else — `DeviceLane.resident_placement_ids` (executor holds device bytes on this lane now) and
// `ObservedWorkerState.held_manifests` (TensorFS manifests the verified store holds complete,
// placed or not), both also on `WorkerSnapshotBody/1`. No bytes, no headroom, no plan: the
// orchestrator routes on counts and membership; VRAM arithmetic stays where it is measured.
//
// THE PACKAGE WIRE (xs-018/xs-019/xs-017). What a pod is told about a published
// package is the hub's own release material and nothing derived: `application`, the
// interface-declared entrypoint model-slot paths, the placed image's pinned inventory, and the
// release's hash-pinned requirements export — all hub-known before the pod exists. Runtime
// preparation receives NO files: wheels come from the package indexes under --require-hashes,
// the package interface rides as the hub release's bytes, and model manifests/objects
// are resolved from the local TensorFS Store the privileged host admitted them to (proto-030).
// `LocalDownloadFile` and `LocalDownloadKind` are DELETED with the per-file handoff; the
// local-package plane keeps its explicitly supplied wheels — the only files with no index
// source — and loses its `kind` rows: the project wheel is the row that MEASURES as the
// package's own distribution/release. `PackageSelection.project_wheel` and `Environment.wheels`
// are deleted: a pod that never retains wheel bytes cannot re-measure WheelFacts, so a
// published install's identity is its locked requirements export
// (`Environment.locked_requirements`) over the image inventory, not a wheel list.
//
// THE STORAGE CUT (proto-031). DownloadDelegation no longer reports held manifests:
// TensorFS computes the missing closure locally and asks only for those bytes. Preparation names
// one immutable `install_root`, never an environment overlay. Local editable wheels stage below
// that install namespace. The proto-026 residency sets on ObservedWorkerState and
// WorkerSnapshotBody remain; the orchestrator still routes on them.
//
// THE EXECUTION LIFECYCLE (proto-061). A preparation may carry the hub release's
// PackageInterface/1 bytes; without them Runtime obtains the interface itself. Placement
// identity is the package release alone, stable as models are added. DISPATCHABLE means the
// executor started and imported the package; models load on demand, and
// `PlacementStatus.loaded_binding_digests` reports the constructions built in the live executor.
// `AttemptMetrics` carries measured working memory and its shape cell.

syntax = "proto3";

package cozy.worker.v1;

option go_package = "cozy/workerprotov1;workerprotov1";
option java_multiple_files = true;
option java_package = "cozy.worker.v1";

// The worker is the gRPC SERVER; the RecordOwner is the CLIENT.
service WorkerControl {
  // Discover Runtime's durable journal lifetime before freezing a submit.
  // Authenticated like the other machine calls; no continuing Control stream needed.
  rpc GetMachineExecutionWorkspace (MachineExecutionWorkspaceQuery) returns (MachineExecutionWorkspace);
  // Runtime owns accepted work independently of the caller connection.
  // These calls observe/control that authority; they do not establish a second
  // RecordOwner or require a client coordinator inside the worker.
  rpc SubmitMachineExecution (MachineExecutionSubmit) returns (MachineExecutionReceipt);
  // Atomically close a submission key against delayed acceptance, returning any existing receipt.
  rpc CloseMachineSubmission (MachineSubmissionClose) returns (MachineSubmissionClosure);
  rpc GetMachineExecution (MachineExecutionQuery) returns (MachineExecutionState);
  rpc ListMachineExecutionEvents (MachineExecutionEventsQuery) returns (MachineExecutionEventPage);
  rpc ControlMachineExecution (MachineExecutionControl) returns (MachineExecutionState);
  // Retired at wire 65: the terminal entry of ListMachineExecutionEvents carries the outcome.
  rpc CollectMachineExecution (MachineExecutionCollect) returns (AttemptOutcome);
  // The owner holds every product of the log and the terminal. Wire 66: this means delivered, and
  // the products stay until the store's GC evicts them (delivered first); before 66 Runtime
  // released the log's holds here.
  rpc AcknowledgeMachineExecutionCollection (MachineExecutionCollectionAck) returns (MachineExecutionState);
  // The triage bundle one terminal attempt's outcome names, read over the same authenticated
  // seam as the outcome.
  rpc ReadMachineExecutionTriage (MachineExecutionTriageQuery) returns (MachineExecutionTriage);
  // Wire 66: the machine's own reads, authenticated like the calls above. A Runtime before 66
  // answers UNIMPLEMENTED, and its caller names the Runtime update for that read only.
  rpc ListMachineExecutions (MachineExecutionListQuery) returns (MachineExecutionList);
  rpc ListPackages (PackageListQuery) returns (PackageList);
  rpc ListModels (ModelListQuery) returns (ModelList);
  rpc DescribeMachine (DescribeMachineQuery) returns (MachineDescription);
  // Durable control: the RecordOwner's request stream carries RecordOwnerFrames, the worker's
  // response stream carries WorkerFrames. Durable messages are never shed to backpressure.
  // Outcome authority lives only here. gRPC orders each DIRECTION independently — there is no
  // cross-direction causal order; causality is expressed by revisions, snapshot ids, and acks.
  rpc Control (stream RecordOwnerFrame) returns (stream WorkerFrame);

  // Bounded LOSSY progress, worker->RecordOwner server-streaming. Sequence-numbered, gaps
  // visible, oldest shed first on overflow, no outcome authority. Where the contract promises
  // that progress saturation cannot block control, the RecordOwner opens WatchProgress on a
  // PHYSICALLY SEPARATE HTTP/2 connection — separate streams on one TCP connection do not
  // prove it.
  rpc WatchProgress (ProgressOpen) returns (stream AttemptProgress);
}

// Loopback-only pod-supervisor -> Runtime preparation seam. Pod-supervisor never registers this
// service on its external listener. Runtime receives logical refs, hub-known release facts,
// (local packages only) verified local wheel paths, and BOTH halves of the
// signed download delegation, because the party that resolves a model's closure against the hub
// is now Runtime's own TensorFS: no presigned URL, worker TLS credential, or index bearer. The
// anonymous public index directives inside locked_requirements are the other origin that
// crosses — an https URL, never a credential.
service RuntimePreparation {
  rpc ProtocolInfo (ProtocolInfoRequest) returns (ProtocolInfoResult);
  rpc NumericalEnvironment (NumericalEnvironmentRequest) returns (NumericalEnvironmentResult);
  // The same authenticated workspace custody service is used by the local owner
  // and the remote Host. Identity/custody is independent of a worker's job root.
  rpc RecordOperationResult (RecordOperationResultCall) returns (RecordOperationResultResult);
  rpc LookupOperation (LookupOperationCall) returns (LookupOperationResult);
  rpc PruneOperationCache (PruneOperationCacheCall) returns (PruneOperationCacheResult);
  rpc WorkspaceRetainDerivedResult (DerivedRetentionCall) returns (DerivedRetentionResult);
  rpc WorkspaceReleaseDerivedRetention (DerivedRetentionCall) returns (DerivedRetentionResult);
  rpc WorkspaceReleaseDerivedResult (DerivedResultReleaseCall) returns (DerivedResultReleaseResult);
  // Ordinary byte-tree custody uses the same authenticated Workspace.
  rpc WorkspaceRetainByteTree (NativeByteRetentionCall) returns (NativeByteRetentionResult);
  rpc WorkspaceReleaseByteTree (NativeByteRetentionCall) returns (NativeByteRetentionResult);
  rpc WorkspaceReadByteTreeObject (NativeByteReadCall) returns (stream NativeByteReadChunk);
  // A retained artifact's closure page or one granted object upload, for the machine
  // connection: the same command WorkerControl carries, authorized by the call's claim.
  rpc WorkspaceNativeArtifactTransfer (NativeArtifactTransferCall) returns (NativeArtifactTransferStatus);
  // The package's owner state changed: drop what this machine read of it at its Hub.
  rpc WorkspaceForgetPackage (ForgetPackageCall) returns (ForgetPackageResult);
  // Authenticated root input intake; native bytes commit before a receipt.
  rpc ImportInputTree (stream InputTreeImportFrame) returns (NativeByteRetentionResult);
  rpc PreparePackageSet (PreparePackageSetRequest) returns (PreparePackageSetResult);
  rpc PrepareModelSource (PrepareModelSourceRequest) returns (PrepareModelSourceResult);
  rpc ReleaseModelSource (ReleaseModelSourceRequest) returns (ReleaseModelSourceResult);
  rpc RetainDerivedResult (DerivedRetentionRequest) returns (DerivedRetentionResult);
  rpc ReleaseDerivedRetention (DerivedRetentionRequest) returns (DerivedRetentionResult);
  rpc ReleaseDerivedResult (DerivedResultReleaseRequest) returns (DerivedResultReleaseResult);
  rpc CollectStoreGarbage (CollectStoreGarbageRequest) returns (CollectStoreGarbageResult);
  rpc ValidateWeightsCheckpoint (ValidateWeightsCheckpointRequest) returns (ValidateWeightsCheckpointResult);
  rpc CheckpointPage (CheckpointPageRequest) returns (CheckpointPageResult);
  rpc CheckpointTransfer (CheckpointTransferRequest) returns (CheckpointTransferStatus);
  rpc PrepareLocalPackage (PrepareLocalPackageRequest) returns (PreparePackageSetResult);
  rpc PreparePrivatePlacement (PreparePrivatePlacementRequest) returns (PreparePackageSetResult);
}

// Loopback-only Runtime-hosted weights seam. pod-supervisor is its only client and dials it on
// the same loopback listener as WorkerControl and RuntimePreparation; it is never registered
// on the external listener. Runtime sends custody observations and outcomes on WorkerControl.
service RuntimeWeights {
  // One validated upload grant in, one terminal answer out. Runtime streams the bytes it holds.
  rpc Upload (WeightsUploadRequest) returns (WeightsUploadResult);
}

// ---------------------------------------------------------------------------
// PodHost -- the RecordOwner <-> pod HOST lane. A second service on the pod's external
// listener, served by pod-supervisor beside WorkerControl. It carries what the host does on the
// owner's behalf and nothing that is control: the owner asks the host to PREPARE (download,
// verify, obtain the PlacementSet bytes from the Runtime's loopback preparation), then sends
// those exact bytes ITSELF as DesiredWorkerState{placement_set} on WorkerControl. Remote and
// local are the same three steps -- prepare, placement_set bytes, desired_state -- and a
// multi-GiB materialization never sits on the control stream's read loop, where before 21 it
// head-of-line blocked every offer, ack, and cancel behind it.
//
// AUTHORITY: every call opens with the owner's Claim -- the same message and the same Ed25519
// proof over ClaimProof/1 the owner presents on WorkerControl -- which the host verifies against
// the same control key the Runtime verifies it against. A call whose record_owner_epoch is
// older than the highest Claim the host has forwarded is refused. A host call is scoped to the
// worker lifetime the proof names, never to one control stream: control_stream_epoch is 0 on
// the Claim and on every request carried here, and nonzero refuses. The request's
// record_owner_epoch and worker_boot_id MUST equal the Claim's.
//
// REPLAY: each lane is durable in the host ledger and idempotent on its identity fields. A
// reconnecting owner re-issues the exact call and receives the ledger's answer (the same
// terminal status, or REPLAYED) or attaches to the operation still in flight. Progress is the
// owner's observed signal; no lane needs a wall-clock guess.
//
// A local machine runs the same Host and serves the same PodHost; only the dial address differs.
// ---------------------------------------------------------------------------
service PodHost {
  // Explicit owner action only. Connection traffic and status reads do not renew idle time.
  rpc KeepRentalAlive (KeepRentalAliveRequest) returns (KeepRentalAliveResult);
  rpc GetMachineExecutionWorkspace (MachineExecutionWorkspaceQuery) returns (MachineExecutionWorkspace);
  // Authenticated forwarding only. Runtime is the sole execution journal/owner.
  rpc SubmitMachineExecution (MachineExecutionSubmit) returns (MachineExecutionReceipt);
  // Atomically close a submission key against delayed acceptance, returning any existing receipt.
  rpc CloseMachineSubmission (MachineSubmissionClose) returns (MachineSubmissionClosure);
  rpc GetMachineExecution (MachineExecutionQuery) returns (MachineExecutionState);
  rpc ListMachineExecutionEvents (MachineExecutionEventsQuery) returns (MachineExecutionEventPage);
  rpc ControlMachineExecution (MachineExecutionControl) returns (MachineExecutionState);
  rpc CollectMachineExecution (MachineExecutionCollect) returns (AttemptOutcome);
  rpc AcknowledgeMachineExecutionCollection (MachineExecutionCollectionAck) returns (MachineExecutionState);
  // Authenticated forwarding only; Runtime holds the bundle bytes.
  rpc ReadMachineExecutionTriage (MachineExecutionTriageQuery) returns (MachineExecutionTriage);
  // Static, read-only compatibility probe over the existing pinned TLS connection.
  // The Host forwards its actual Runtime's loopback result; it does not guess a version.
  rpc ProtocolInfo (ProtocolInfoRequest) returns (ProtocolInfoResult);
  rpc NumericalEnvironment (NumericalEnvironmentCall) returns (NumericalEnvironmentResult);
  rpc PreparePackageSet (PreparePackageSetCall) returns (stream PrepareEvent);
  rpc PrepareLocalPackage (PrepareLocalPackageCall) returns (stream PrepareEvent);
  rpc PreparePrivatePlacement (PreparePrivatePlacementCall) returns (stream PrepareEvent);
  rpc ModelSourceFile (ModelSourceFileCall) returns (stream ModelSourceFileStatus);
  rpc ModelSourcePrepare (ModelSourcePrepareCall) returns (ModelSourcePrepared);
  rpc ModelSourceRelease (ModelSourceReleaseCall) returns (ReleaseModelSourceResult);
  rpc ModelSourceControl (ModelSourceControlCall) returns (ModelSourceControlResult);
  rpc RetainDerivedResult (DerivedRetentionCall) returns (DerivedRetentionResult);
  rpc ReleaseDerivedRetention (DerivedRetentionCall) returns (DerivedRetentionResult);
  rpc ReleaseDerivedResult (DerivedResultReleaseCall) returns (DerivedResultReleaseResult);
  rpc RetainByteTree (NativeByteRetentionCall) returns (NativeByteRetentionResult);
  rpc ReleaseByteTree (NativeByteRetentionCall) returns (NativeByteRetentionResult);
  rpc ReadByteTreeObject (NativeByteReadCall) returns (stream NativeByteReadChunk);
  // A retained output's closure and granted object uploads, as `cozy run upload` sends them.
  rpc NativeArtifactTransfer (NativeArtifactTransferCall) returns (NativeArtifactTransferStatus);
  // `cozy package bind`, `unbind` or `publish` changed the package: the machine reads it once more.
  rpc ForgetPackage (ForgetPackageCall) returns (ForgetPackageResult);
  // Proxies the bounded stream to Runtime without owning its byte custody.
  rpc ImportInputTree (stream InputTreeImportFrame) returns (NativeByteRetentionResult);
  rpc RecordOperationResult (RecordOperationResultCall) returns (RecordOperationResultResult);
  rpc LookupOperation (LookupOperationCall) returns (LookupOperationResult);
  rpc PruneOperationCache (PruneOperationCacheCall) returns (PruneOperationCacheResult);
  rpc ModelSourceAdopt (ModelSourceAdoptCall) returns (ModelSourcePrepared);
  rpc CheckpointPage (CheckpointPageCall) returns (CheckpointPageResult);
  rpc CheckpointTransfer (CheckpointTransferCall) returns (CheckpointTransferStatus);
  rpc LocalPackageUpload (stream LocalPackageUploadFrame) returns (stream LocalPackageFileStatus);
  // Wire 66: the machine's truth, read directly. The Host forwards ListMachineExecutions and
  // ListPackages; it answers ListModels from its TensorFS store and DescribeMachine with its own
  // facts beside its Runtime's, so both work while the Runtime is stopped. A Host before 66
  // answers UNIMPLEMENTED; a Runtime before 66 leaves only the reads it serves unanswered.
  rpc ListMachineExecutions (MachineExecutionListQuery) returns (MachineExecutionList);
  rpc ListPackages (PackageListQuery) returns (PackageList);
  rpc ListModels (ModelListQuery) returns (ModelList);
  rpc DescribeMachine (DescribeMachineQuery) returns (MachineDescription);
  // Wire 72: a bounded log the machine keeps on its own disk, oldest line first. The Host reads
  // it, so it answers while the Runtime is stopped. A Host before 72 answers UNIMPLEMENTED, which
  // callers report as a machine that predates the log, never as a failure of anything else.
  rpc ReadMachineLog (MachineLogQuery) returns (stream MachineLogChunk);
}

// Wire 72: the logs a machine keeps. Readers name an unknown value only to a newer Host; an
// older one answers NOT_FOUND for it.
enum MachineLog {
  MACHINE_LOG_UNSPECIFIED = 0;
  // TensorFS's transport decisions, one line each: `<unix seconds> <kind> <subject> <detail>`
  // for every hedge, lane grant, win and pull walk. TensorFS rotates it to one older file.
  MACHINE_LOG_TENSORFS_TRANSPORT = 1;
}

message MachineLogQuery {
  Claim claim = 1;
  MachineLog log = 2;
  uint64 tail_bytes = 3;  // at most the newest this many bytes, from a line start; 0: all kept
}

// Consecutive pieces of the log, oldest first; the stream ends after the last. A log the
// machine has not written yet is an empty stream.
message MachineLogChunk {
  bytes data = 1;         // nonempty, <=MaxMachineLogChunkBytes
}

message ProtocolInfoRequest {}

// One explicit authenticated idle reset. The Host validates the current Claim,
// rental lifetime, and a nonempty request_id of at most MaxRentalKeepaliveRequestIDBytes.
// The same owner/boot/request_id returns its original receipt without extending it.
// A new user command supplies a new request_id. There is no duration override.
message KeepRentalAliveRequest {
  Claim claim = 1;
  string request_id = 2;
}

// Host-clock acknowledgement. idle_deadline_unix_ms is exactly
// acknowledged_at_unix_ms + RentalIdleTimeoutSeconds * 1000. Clients only
// project/persist this acknowledged deadline; lost/failed RPCs do not renew locally.
message KeepRentalAliveResult {
  string request_id = 1;
  string worker_id = 2;
  string worker_boot_id = 3;
  int64 acknowledged_at_unix_ms = 4;
  int64 idle_deadline_unix_ms = 5;
}

// DOCUMENT SHAPE: cozy.worker.v1.MachineExecutionCapture/2. Installation handles
// select retained environments, not content identities. Runtime supplies interface
// metadata after installation. No client filesystem paths or credentials belong here.
message MachineExecutionCapture {
  reserved 1, 2, 4;
  reserved "root_revision_digest", "revisions", "published_revisions";
  repeated MachineCallableBinding bindings = 3; // sorted by caller/module/export
  repeated MachineModelDefault model_defaults = 5; // sorted by callee/entrypoint/parameter
  string root_installation_id = 6;
  repeated InstalledPackage installed_packages = 7; // 1..128, sorted by installation_id
  // Sorted by key, <=128.
  repeated DeferredInstallation deferred_installations = 8;
  reserved 9;                         // Runtime reads its own Hub for slots without a row
  reserved "catalog_origin";
  // Wire 70: explicit root/captured-callable selections, sorted by parameter. The
  // capture digest retains them across retries and descendants. Overrides name only
  // callables in this captured graph; an adapter stack keeps its authored order.
  repeated ModelChoice model_choices = 10;
}

// A published callee Runtime installs on its first selection instead of before acceptance.
// Bindings and model defaults name it by key. The installed interface is authoritative once
// prepared; preparation's own package_interface is the release's, for verifying the capture.
message DeferredInstallation {
  string key = 1; // "org/name@release", unique within the capture
  string package = 2;
  string release = 3;
  PreparePackageSetRequest preparation = 4; // this callee's download set and facts; install_root empty
}

// Frozen selection metadata, never a future call or a producer receipt. An
// explicit Model argument bypasses this row. Unavailable defaults do not prevent
// importing a library or supplying an override. Every imported inference Model
// slot has one row when this feature is used; no alias is resolved after accept.
message MachineModelDefault {
  reserved 1;
  reserved "callee_revision_digest";
  string entrypoint = 2;
  string parameter = 3;
  string public_origin = 4; // exact configured anonymous catalog origin; no credentials
  repeated MachineModelDefaultRung rungs = 5; // authored/owner ladder order, unique (GPU, count) selectors
  string unavailable_code = 6; // exclusive with origin/rungs; bounded safe reason
  string callee_installation_id = 7;
  string callee_deferred_key = 8; // exclusive with callee_installation_id
}

message MachineModelDefaultRung {
  // Zero preserves earlier captures: count was unspecified, never implicitly one.
  // Positive counts select the exact execution group, not the whole machine width.
  uint32 gpus = 4;
  string gpu = 1; // existing GPU selector, or "*"
  string repository = 2; // org/name; native catalog membership remains mandatory
  Ref manifest = 3; // immutable checkpoint, never a release/lane lookup at use time
}

message InstalledPackage {
  string installation_id = 1; // opaque lifetime handle, never derived from package contents
  string package = 2;
  string release = 3;
  bytes package_interface = 4; // discovered in this installation, no cross-SDK digest check
}

message MachineCallableBinding {
  reserved 1, 2, 5;
  reserved "caller_revision_digest", "interface_digest", "callee_revision_digest";
  string module = 3;
  string export = 4;
  string entrypoint = 6;
  string caller_installation_id = 7;
  string callee_installation_id = 8;
  string callee_deferred_key = 9; // exclusive with callee_installation_id
  string caller_deferred_key = 10; // a deferred callee's own imports; exclusive with caller_installation_id
}

message MachineExecutionWorkspaceQuery {
  Claim claim = 1;
  // The machine describes this published release as it reads it from its own Hub (the newest
  // release when `release` is empty), in MachineExecutionWorkspace.described_release.
  PackageSelection describe = 2;
  reserved 3;
  reserved "catalog_origin";
}

message MachineExecutionWorkspace {
  string worker_id = 1;
  string worker_boot_id = 2;
  string execution_workspace_id = 3; // exact Runtime journal lifetime, never a path or credential
  // Additive observations measured by Runtime at boot. Readers never substitute their own probe.
  repeated MachineDevice devices = 4; // every device Runtime schedules, in ordinal order
  string accelerator_backend = 5;     // "cuda" | "none"; empty from a Runtime that does not report
  bool executor_uid_isolation = 6;    // package executors run under a uid separate from Runtime's
  reserved 7 to 19;                   // minor-64 hard cut: every Runtime does these
  reserved "cpu_slot_model_inputs", "exact_execution_gpus", "owner_publication_reconciliation",
           "source_credentials", "deferred_installations", "resolves_model_defaults",
           "release_roots", "input_object_reuse", "event_wait", "memo_lookup",
           "release_root_sources", "release_root_jobs", "release_root_installs";
  DescribedRelease described_release = 20; // the query's `describe`, answered
  // Wire 65: the run output log. Its execution events carry `product` and the terminal
  // `outcome`. A Host forwards this field unchanged, so it is the capability Creator reads.
  bool run_output_log = 21;
  // Submit accepts a ReleaseRoot naming installation_id and resolves its open Model slots,
  // org-relative defaults under ReleaseRoot.owner. Without it a controller submits unpublished
  // code as a capture with its Models resolved.
  bool release_root_owner = 22;
  // Wire 68: close a submission key before re-placement or canceling unknown acceptance.
  bool submission_close = 23;
  // Wire 70: ordered adapter stacks and explicitly qualified captured-callable Model
  // overrides. Required only by those selections; ordinary base-only roots remain valid.
  // A Host forwards this Runtime capability unchanged.
  bool model_overrides = 24;
}

// A published release as the machine read it: the exact release and its interface.
message DescribedRelease {
  string package = 1;
  string release = 2;
  bytes package_interface = 3; // canonical PackageInterface/1 bytes
}

// One measured accelerator. MachineExecutionGpu.ordinals name these ordinals.
message MachineDevice {
  uint32 ordinal = 1;
  string name = 2;
  string uuid = 3;
  uint64 memory_bytes = 4;
  string pci_bus_id = 5;
  string driver_version = 6;
}

// Closing is durable even when submission has not arrived. An existing execution is
// returned, not silently canceled: the caller must reconcile/control it before re-placement.
message MachineSubmissionClose {
  Claim claim = 1;
  string submission_id = 2;
  string request_id = 3;
  string expected_execution_workspace_id = 4;
}

message MachineSubmissionClosure {
  string submission_id = 1;
  string request_id = 2;
  string execution_workspace_id = 3;
  MachineExecutionReceipt receipt = 4; // absent proves no acceptance and prevents later acceptance
}

message MachineExecutionSubmit {
  Claim claim = 1; // authentication now, never a continuing observer-liveness lease
  string submission_id = 2; // <=256 bytes; identical resubmission returns one receipt
  bytes capture_digest = 3;
  bytes capture_canonical_bytes = 4; // <=1 MiB; verify digest before closed parsing
  AttemptOffer offer = 5; // first ordinal; existing immutable InvocationSpec/outcome codecs
  reserved 6, 7;                     // Runtime never re-executes an attempt
  reserved "max_attempts", "retry_delay_ms";
  DesiredWorkerState prepared_state = 8; // exact initial binding/capacity evidence
  // prepared_state is scoped to this execution; it cannot replace another accepted
  // execution or become authority to buy capacity. Runtime retains/revalidates its
  // own immutable preparation paths; client paths are not restart authority.
  bytes payload_canonical_bytes = 9; // bounded typed arguments; hash must equal InvocationSpec.payload_digest
  // Runtime retains payload and native input custody before acceptance. No later
  // attempt may depend on a laptop file URL or an expired original delivery grant.
  string publication_authorization_id = 10; // optional canonical nonzero UUID
  // Empty grants no Hub publication authority. Otherwise this exact independently
  // authorized, machine-bound grant is immutable for the root and its descendants.
  // Runtime must persist it before acceptance and cannot borrow another root's
  // grant. No token/key, authority URL or script content belongs in this field.
  // Changing it requires a new submission, never an idempotent replay or resume.
  string expected_execution_workspace_id = 11; // required on first submit and every replay
  // The RecordOwner durably pins this identity BEFORE sending the first submit and
  // never refreshes it after an ambiguous reply. Runtime checks it in the SAME journal
  // transaction that finds or accepts the execution. Replacement refuses typed as
  // execution_workspace_changed; an empty identity refuses as execution_workspace_required.
  // Neither refusal proves that an earlier submit did not execute in another journal.
  repeated SourceCredential source_credentials = 12; // memory-only; see SourceCredential
  // A root named by its published release. The offer carries only
  // request_id; there is no capture or prepared_state: Runtime installs, resolves, prepares
  // and mints them, and the receipt names what it minted. The machine installs every release
  // the root's closure names itself, reading its own Hub. Until then Submit answers
  // UNAVAILABLE with cozy-error-code release_root_preparing (the message is progress).
  ReleaseRoot release_root = 13;
  // The record owner answers this execution's memo.lookup events.
  // False: a local miss computes at once; Runtime never waits on the owner.
  bool owner_memo = 14;
  // The account that owns the run. Unpublished code (local/) has no org, so the org-relative
  // Model defaults of it and of every unpublished callee resolve under this account. Empty:
  // such a default is refused. A published package's org is its own.
  string account = 15;
  // Wire 69: explicit Hub scope for a captured root and its descendants. This selects
  // an existing scoped grant; no authority is conferred by the URL. Retained before
  // acceptance and immutable on replay. Release-root submissions use ReleaseRoot.hub.
  string hub = 16;
}

message ReleaseRoot {
  string package = 1;
  // Exactly one of release and installation_id names the root's code.
  string release = 2;
  string entrypoint = 3;
  reserved 4, 5, 12;                  // the machine reads the closure and origin itself
  reserved "callees", "installations", "catalog_origin";
  repeated ModelChoice models = 6; // explicit Model choices only, sorted by parameter
  repeated InputBinding inputs = 7; // byte inputs other than payload, as InvocationSpec.inputs
  repeated InputAccess input_access = 8; // their native trees, as DeliveryGrant.inputs
  uint64 deadline_unix_ms = 9;
  string attention_kernel = 10;
  ActivationCapture capture = 11;
  // The entrypoint names a published job: Runtime mints its
  // JobInvocationSpec and directive from the job's declaration, as it does for child jobs.
  bool job = 13;
  // `--upload-to`: each weights output is sent to model://<weights_destination>. Empty: the
  // job's weights stay in the scratch grant.
  string weights_destination = 14;
  // The owner's scratch publication grant for this job ("org/_job-<request>").
  string publication_grant = 15;
  // A captured installation this machine already holds (an unpublished package the
  // controller prepared on it with PreparePackageSet) instead of a published release. The
  // machine resolves its slots, installs its published callees and mints the offer exactly
  // as for a release. Absent here: Submit refuses with cozy-error-code
  // release_root_installation_absent, and the controller prepares it and asks again.
  string installation_id = 16;
  // The account an unpublished installation's org-relative Model references name: it has no
  // org of its own. A published release's org is its package's. Sent only to a machine whose
  // workspace advertises release_root_owner.
  string owner = 17;
  // Wire 67: the Tensorhub origin this run came from. The machine reads the release, its callees,
  // its package index and its Models there, with its registration at that Hub. Empty: the
  // machine's default Hub. A Runtime before 67 ignores it and reads its default Hub, so a
  // controller sends another Hub's run only to a machine whose range reaches 67.
  string hub = 18;
}

// An explicit Model for one slot. A manifest pins the checkpoint; otherwise Runtime reads the
// repository's release (newest when empty) and takes `lane`, or the slot's default ladder lanes.
// A provider `source` instead has the machine resolve it (headers first), download only the
// members its reviewed profiles need, convert them and bind the result; never with repository
// or manifest.
message ModelChoice {
  // A bare parameter or the root's full slot path selects a root slot. Wire 70 also
  // accepts <entrypoint>.models.<parameter> for a captured callable in the root package,
  // or <package>/<entrypoint>.models.<parameter> for a captured external callable.
  // These are exact targets, never suffix matches or broadcasts. Unknown/uncaptured
  // targets refuse the operation. An adapter-only choice retains the selected base.
  string parameter = 1;
  string repository = 2;
  string release = 3;
  string lane = 4;
  Ref manifest = 5;
  string source = 6;            // immutable hf://org/repo@revision[/member] or civitai://version
  repeated string profiles = 7; // reviewed TensorFS profiles; empty: the machine selects one
  repeated DownloadAdapterRef adapters = 8; // Wire 70: ordered; order/scale are execution identity
}

// The owner's credential for one provider's native source calls, for this execution and its
// descendants. Runtime holds the value in memory only: never its journal, events, logs or
// diagnostics. It presents it only as NativeSourceCommand.credential for that provider. An
// identical resubmission replaces the values, which is how an owner supplies them again.
message SourceCredential {
  NativeSourceOperation provider = 1; // HUGGINGFACE or CIVITAI
  string credential = 2;              // `bearer <token>`; empty presents none
}

message MachineExecutionReceipt {
  string request_id = 1;
  string submission_id = 2;
  bytes capture_digest = 3;
  bytes invocation_spec_digest = 4;
  uint64 accepted_at_ms = 5;
  string worker_id = 6;
  string worker_boot_id = 7; // acceptance boot; a later boot may reopen the same execution journal
  string execution_workspace_id = 8; // Runtime journal lifetime identity, not a filesystem path
  string publication_authorization_id = 9; // exact accepted scope reference, or empty
  uint64 number = 10; // wire 66: the run's number on this machine; 0 from an older Runtime
}

message MachineExecutionQuery {
  Claim claim = 1;
  string request_id = 2;
  string expected_execution_workspace_id = 3; // a replaced/lost execution journal refuses
}

message MachineExecutionState {
  string request_id = 1;
  uint64 attempt_ordinal = 2;
  uint64 generation = 3;
  string state = 4; // Runtime's bounded execution state, including queued/running/terminal
  bool collected = 5;
  uint64 sequence = 6;
  string worker_id = 7;
  string worker_boot_id = 8; // current boot, distinct from the receipt's acceptance boot
  string execution_workspace_id = 9;
  MachineExecutionGpu gpu = 10; // additive observation; absent reads as phase "none"
  // Providers this unfinished execution was given a credential for whose value Runtime no longer
  // holds (a restart). Their source calls wait until the owner resubmits with source_credentials.
  repeated NativeSourceOperation awaiting_source_credentials = 11;
  // Wire 66; zero or absent from an older Runtime.
  uint64 number = 12;          // the run's number on this machine; 0 for a child call
  uint64 accepted_at_ms = 13;
  uint64 finished_at_ms = 14;  // when it reached its terminal state; 0 while open
  MachineExecutionTarget target = 15;
}

// What a run executes, for people and listings. Never an identity.
message MachineExecutionTarget {
  string package = 1;          // org/name
  string release = 2;
  string entrypoint = 3;       // the function or job; empty when the machine cannot name it
  string installation_id = 4;
  bool job = 5;
}

// Runtime's GPU scheduler view of one execution and its descendant calls. Observation only:
// nothing is decided from it, and a reader tolerates an unknown phase.
message MachineExecutionGpu {
  string phase = 1;               // none | waiting | granted | executing | holding
  uint32 width = 2;               // GPUs the waiting or granted call needs
  repeated uint32 ordinals = 3;   // the granted devices, or the root's held lease when holding
  repeated string blocked_by = 4; // root request ids holding the GPUs a waiting call needs
}

message MachineExecutionEventsQuery {
  MachineExecutionQuery execution = 1;
  uint64 after = 2;
  uint32 limit = 3; // 0 means 256; at most 256, bounded to 256 KiB per page
  // When no event follows `after`, answer once one does or the caller goes away. An observer
  // holds one such read open instead of polling.
  bool wait = 4;
}

message MachineExecutionEvent {
  uint64 sequence = 1;
  uint64 attempt_ordinal = 2;
  uint64 at_ms = 3;
  string kind = 4;
  bytes body_canonical_bytes = 5; // bounded canonical JSON metadata, <=64 KiB
  // Kind "product": one product entered an output of this run. body_canonical_bytes holds the
  // same RunProduct as its canonical document.
  RunProduct product = 6;
  // Kind "outcome": the exact terminal of the current attempt, the last entry of the run's log.
  // It replaces CollectMachineExecution; a page that carries it may exceed 256 KiB.
  AttemptOutcome outcome = 7;
}

// The run output log's unit of incremental delivery. An output is an asset field of the
// function's declared result: a single output's product is replaced by each SET, a list output
// grows by one APPEND per product. The run's result is the fold of its products. The bytes
// were committed and are held by the log before the entry is journaled; the owner reads them
// with ReadByteTreeObject from `source` (or each part's source). Before wire 66 they are held
// until the owner acknowledges the terminal; from 66 until the store's GC evicts them, so any
// authorized client can fetch them later. A SET is released as soon as a newer SET of its
// output supersedes it.
message RunProduct {
  string output = 1;           // declared result field path, e.g. "video", "references"
  RunProductOp op = 2;
  uint32 index = 3;            // APPEND: position in the list output; SET: 0
  Ref content = 4;             // sha256 and length of the product's bytes
  string media_type = 5;
  string label = 6;            // for people, e.g. "Video (segment 3 of 9)"; <=256 bytes
  // Exactly one of source and parts. With parts the bytes are the parts concatenated in order.
  NativeByteRetentionRequest source = 7;
  repeated RunProductPart parts = 8;
}

message RunProductPart {
  Ref content = 1;
  NativeByteRetentionRequest source = 2;
  uint64 duration_us = 3;      // media time this part adds; 0 for an initialization segment
}

enum RunProductOp {
  RUN_PRODUCT_OP_UNSPECIFIED = 0;
  RUN_PRODUCT_OP_SET = 1;
  RUN_PRODUCT_OP_APPEND = 2;
}

message MachineExecutionEventPage {
  repeated MachineExecutionEvent events = 1;
  uint64 next_after = 2;
  uint64 head_sequence = 3;
  uint64 compacted_through = 4; // explicit lossy progress gaps; terminal history is retained
}

enum MachineExecutionAction {
  MACHINE_EXECUTION_ACTION_UNSPECIFIED = 0;
  MACHINE_EXECUTION_ACTION_PAUSE = 1;
  MACHINE_EXECUTION_ACTION_RESUME = 2;
  MACHINE_EXECUTION_ACTION_CANCEL = 3;
  // Settle one sent publication from MachineExecutionControl.publication. Runtime refuses it
  // while its own publication authority still answers.
  MACHINE_EXECUTION_ACTION_RECONCILE_PUBLICATION = 4;
  // Answer one memo.lookup from MachineExecutionControl.memo.
  MACHINE_EXECUTION_ACTION_ANSWER_MEMO = 5;
}

message MachineExecutionControl {
  MachineExecutionQuery execution = 1;
  string command_id = 2; // idempotent; same ID with changed contents refuses
  uint64 expected_generation = 3;
  MachineExecutionAction action = 4;
  MachinePublicationReconciliation publication = 5; // RECONCILE_PUBLICATION only
  MachineMemoAnswer memo = 6;                        // ANSWER_MEMO only
}

// The record owner's answer to one memo.lookup, from its own completed results. Runtime
// accepts a hit only for the same operation and computation digest, and only a result that
// names durable custody the operation's own completion would name (an upload's committed
// checkpoint in the call's destination). Anything else is refused typed and computes.
message MachineMemoAnswer {
  uint64 lookup_sequence = 1;       // the memo.lookup event answered
  bytes computation_digest = 2;     // 32 bytes; equals the lookup's
  bytes result_canonical_bytes = 3; // empty is a miss; else the recorded result, <= 48 KiB
}

// The owner's read of one sent publication's Hub finalization status, forwarded unmodified.
// Runtime verifies it names this call's operation, checkpoint and objects before settling:
// completed commits, failed or an absent publication/finalization (404) is uncommitted, and
// a queued or running finalization is refused as pending.
message MachinePublicationReconciliation {
  uint32 call_index = 1;   // the publication effect of this execution
  uint32 http_status = 2;  // Hub's status for GET .../publications/{operation}/finalization
  bytes finalization = 3;  // Hub's exact response body
}

message MachineExecutionCollect {
  MachineExecutionQuery execution = 1;
  uint64 attempt_ordinal = 2; // zero selects the current attempt
}

message MachineExecutionCollectionAck {
  MachineExecutionQuery execution = 1;
  AttemptOutcomeAck outcome = 2; // exact terminal identity, after recipient custody
  // GET/status/watch/collect alone do not release uncollected-result ownership.
  // This ACK records collection; it does not delete independent native holds.
}

message MachineExecutionTriageQuery {
  MachineExecutionQuery execution = 1;
  uint64 attempt_ordinal = 2; // zero selects the current attempt
}

// NOT_FOUND when the outcome names no bundle or the bundle is no longer retained.
message MachineExecutionTriage {
  TriageBundleRef bundle = 1;       // exactly the reference the attempt's outcome carries
  bytes bundle_canonical_bytes = 2; // <= 1 MiB; sha256 equals bundle.write_receipt_digest
}

// Wire 66. One page of this machine's runs by `number`: the execution journal's sequence of root
// executions, assigned at acceptance and never reused within that journal. Child calls have no
// number and are not listed. Oldest first after `after_number`, or newest first before
// `before_number` (0: from the newest). The next page's cursor is the last row's number.
message MachineExecutionListQuery {
  Claim claim = 1;
  uint64 after_number = 2;
  bool newest_first = 3;
  uint64 before_number = 4;    // newest_first only
  uint32 limit = 5;            // 0 means 64; at most 256
  repeated string states = 6;  // only runs in these MachineExecutionState.state values; empty: all
  // Oldest first only: when no listed run follows after_number, answer once one is accepted or
  // the caller goes away. A follower holds one such read open instead of polling.
  bool wait = 7;
}

message MachineExecutionList {
  repeated MachineExecutionState executions = 1; // in the query's order
  uint64 head_number = 2;                         // the newest number assigned; 0: none yet
  string execution_workspace_id = 3;              // the journal lifetime its numbers belong to
}

message PackageListQuery {
  Claim claim = 1;
}

message PackageList {
  repeated MachinePackage packages = 1; // sorted by package, release, installation_id
}

// One installed environment this machine holds.
message MachinePackage {
  string installation_id = 1;
  string package = 2;                   // org/name; local/<name> for unpublished code
  string release = 3;
  string origin = 4;                    // release | local | runtime; readers tolerate others
  uint64 installed_at_ms = 5;
  repeated ImageDistribution sdk = 6;   // the Cozy SDK installed in it (cozy-runtime, tensorfs)
  repeated string entrypoints = 7;      // its interface's functions and jobs, sorted
}

message ModelListQuery {
  Claim claim = 1;
}

// The weights this machine holds: its TensorFS store's repository rows and usage, as
// `tfs repo list` and `tfs repo usage` report them.
message ModelList {
  repeated MachineModel models = 1;           // sorted by repository, version, lane
  repeated RepositoryUsage repositories = 2;  // sorted by repository
  StoreUsage store = 3;
}

message MachineModel {
  string kind = 1;              // release | local; readers tolerate others
  string repository = 2;        // org/name; a local alias is local/<name>
  string version = 3;           // release rows
  string lane = 4;              // release rows
  string source_selection = 5;  // local rows: the source it was made from
  Ref manifest = 6;
  bool complete = 7;            // the store holds the manifest's whole closure
}

message RepositoryUsage {
  string repository = 1;
  uint64 bytes_total = 2;       // everything its retained checkpoints reach
  uint64 bytes_unique = 3;      // what no other repository reaches: removing it frees this
}

message StoreUsage {
  uint64 bytes_total = 1;         // the union every repository reaches
  uint64 bytes_unique_sum = 2;
  uint64 bytes_unreferenced = 3;  // verified objects no retained manifest reaches
  MachineFilesystem filesystem = 4;
}

message MachineFilesystem {
  string path = 1;
  uint64 total_bytes = 2;
  uint64 available_bytes = 3;
}

message DescribeMachineQuery {
  Claim claim = 1;
}

// Wire 66: what this machine is. Replaces ProtocolInfo, GetMachineExecutionWorkspace's
// inventory and ClaimAck.resources for new clients. A Host fills `host` and forwards its
// Runtime's `runtime`; a Runtime answers `runtime` alone.
message MachineDescription {
  string worker_id = 1;
  string worker_boot_id = 2;
  MachineHost host = 3;
  MachineRuntime runtime = 4;
  string runtime_absent = 5;    // why `runtime` is absent, for people; empty when present
}

message MachineHost {
  string version = 1;                // the Host's release
  uint32 wire_minor = 2;
  uint32 minimum_wire_minor = 3;
  string platform = 4;               // os/arch, as WorkerResources.platform
  string os_release = 5;
  string hostname = 6;
  string phase = 7;                  // booting | ready | idle | releasing; readers tolerate others
  uint64 idle_deadline_unix_ms = 8;  // 0: no idle release pending
  repeated MachineHub hubs = 9;
  repeated MachineFilesystem filesystems = 10;
  uint64 started_at_unix_ms = 11;
}

message MachineHub {
  string origin = 1;       // the Hub's https origin
  string machine_id = 2;   // this machine's worker id at that Hub
}

message MachineRuntime {
  string version = 1;                 // the cozy-runtime release
  uint32 wire_minor = 2;
  uint32 minimum_wire_minor = 3;
  string tensorfs_version = 4;
  string python_version = 5;
  string torch_version = 6;           // empty: no torch in the Runtime's environment
  string uv_version = 7;
  string accelerator_backend = 8;     // cuda | none; empty when unmeasured
  bool executor_uid_isolation = 9;
  repeated MachineDevice devices = 10;
  WorkerResources resources = 11;     // backend_version is the CUDA toolkit torch was built for
  string execution_workspace_id = 12;
  uint64 started_at_unix_ms = 13;
  MachineFilesystem store = 14;       // the TensorFS store's filesystem
  repeated PythonInterpreter interpreters = 15; // the Pythons packages may install against
  // Wire 71: optional current/recent model preparation observations, using the same exact
  // selections and counters as PrepareEvent. Readers may sample without waiting for a
  // preparation lock; multiple observers see the same native work. Empty on an older peer
  // means telemetry unavailable and never refuses preparation or execution.
  repeated PrepareModelProgress preparation_progress = 16;
}

// No ownership, credential, readiness or machine state. Callers record the range and gate
// preparation and execution on it; a missing RPC or disjoint range never refuses the connection
// or Claim. Generated constants are the authority. PodHost answers the intersection of its own
// range and its Runtime's, or its own range when they share no minor; it then refuses
// preparation and execution itself, naming the Runtime update.
message ProtocolInfoResult {
  uint32 wire_minor = 1;
  uint32 minimum_wire_minor = 2;
  reserved 3 to 9;                    // minor-64 hard cut: every peer does these
  reserved "supports_mixed_model_inputs", "supports_model_materialization_recovery",
           "supports_local_installation_reuse", "supports_rental_keepalive",
           "supports_weights_transaction_refusal", "supports_machine_execution_triage",
           "supports_prepare_while_landing";
}

// The three preparations name the same logical sets the retiring DesiredWorkerState modes
// carried; the difference is who sends the result to the worker.
// (xs-019) Beside the signed set ride the facts prepare consumes, every one of them
// hub-known from the release record and the registered image before the pod exists. No package
// file or model file travels; the pod installs from the indexes and resolves model manifests
// from its local TensorFS Store. The release's interface document may travel (field 10).
message PreparePackageSetCall {
  Claim claim = 1;
  DesiredPackageSet package_set = 2;
  string application = 3;                // the release interface's application; nonempty
  repeated string model_slot_paths = 4;  // every interface-declared entrypoint model-slot path;
                                         // sorted unique; <= MaxModelSlotPaths
  ImageInventory image_inventory = 5;    // the placed image's exact pinned inventory
  bytes locked_requirements = 6;         // hash-pinned requirements export of the release's
                                         // uv.lock (project pin included), installable with
                                         // --require-hashes against PyPI plus the org index.
                                         // The only admitted rows are blank/comment lines,
                                         // https --index-url/--extra-index-url directives
                                         // (how the installer learns the two indexes; the org
                                         // index is anonymous public, th-113 — no credential
                                         // is spellable here), and exact hash-pinned
                                         // requirements; <= MaxLockedRequirementsBytes
  // The caller re-ensures exact inputs after Runtime's typed model_materialization_required.
  reserved 7;
  reserved "supports_model_materialization_recovery";
  // Declared PEP 440 Python range and optional exact captured version.
  // Worker intersects these with its installed rolling supported window before install.
  string python_requires = 8;
  string python_version = 9;
  // The hub release's PackageInterface/1 canonical bytes. Empty: Runtime obtains them itself.
  bytes package_interface = 10;
  // Wire 67: the Tensorhub origin the set is read and its Models fetched at; empty: the machine's
  // default Hub.
  string hub = 11;
}

message PrepareLocalPackageCall {
  Claim claim = 1;
  DesiredLocalPackageSet local_package_set = 2;
  // Wire 69: select this machine's scoped Hub grant for account-index dependencies.
  // Empty never borrows an attached persistent-machine grant; a rental may use its own.
  string hub = 3;
}

message PreparePrivatePlacementCall {
  Claim claim = 1;
  DesiredPrivatePlacementSet private_placement_set = 2;
  reserved 3;
  reserved "supports_model_materialization_recovery";
}

// One preparation's observable progress. Byte counters are monotonic within a call; the
// terminal PREPARED event carries the exact DesiredPlacementSet the owner sends next, and the
// terminal REFUSED event carries one bounded safe code and detail.
message PrepareEvent {
  PrepareStage stage = 1;
  uint64 total_bytes = 2;           // bytes the bounded plan must land; 0 until RESOLVED
  uint64 transferred_bytes = 3;     // verified so far
  DesiredPlacementSet placement_set = 4;  // PREPARED only
  string safe_code = 5;             // REFUSED only
  string safe_detail = 6;           // REFUSED only; bounded <= 1024 bytes, sanitized
  repeated PrepareModelProgress model_progress = 7; // complete current model rows;
                                      // keep completed rows through PREPARED. Optional telemetry.
  InstalledPackage installed_package = 8; // PREPARED; worker-installed callable metadata
}

// Per-model availability, including objects held before this preparation. Counters are
// observations, not custody or billing authority. Different manifests may share objects:
// summing these rows does not measure unique network traffic. Zero total means unknown.
message PrepareModelProgress {
  DownloadModelRef model = 1;       // exact existing selection; no second identity scheme
  uint64 total_bytes = 2;          // native TensorFS plan's declared object bytes
  uint64 transferred_bytes = 3;    // held + newly verified origin/cache bytes for this model
  uint64 origin_bytes = 4;         // newly fetched from origin during this preparation
  uint64 cached_bytes = 5;         // newly fetched from cache during this preparation
  // Verified bytes newly published to the mounted cache for this exact runtime closure.
  // A lower bound when replication is incomplete; never inferred from origin/held bytes.
  uint64 cache_written_bytes = 6;
}

message ModelSourceFileCall {
  Claim claim = 1;
  ModelSourceFileRequest request = 2;
}

message ModelSourcePrepareCall {
  Claim claim = 1;
  ModelSourcePrepareRequest request = 2;
}

// Permanent owner disposition, never a pause. Host journals the tombstone,
// cancels outstanding fetches, drains entered conversion, then releases this
// operation's native roots. Other source operations are unaffected.
message ModelSourceReleaseCall {
  Claim claim = 1;
  string operation_id = 2;
  bytes source_selection_digest = 3;
}

// Loopback-only Host -> Runtime. The Host has already checked signed ownership
// and exact source selection; Runtime serializes against native preparation.
message ReleaseModelSourceRequest {
  string operation_id = 1;
}

// Independent result custody preserves the original native receipt and
// manifest. The RecordOwner assigns retention_id; it never enters author payloads.
// tensorfs_receipt_digest hashes the NATIVE canonical TensorFS receipt, not its
// enclosing cozy.worker.v1.WeightsReceipt document. Runtime verifies it natively.
// Read-only actual numerical platform identity. It excludes caller package code,
// machine UUID, custody/attempt clocks, paths, and credentials. Missing proof
// refuses this probe; callers may execute without cross-request result reuse.
message NumericalEnvironmentRequest {}
// Owner control revision orders non-releasing source pause/resume. A paused
// acknowledgement proves entered source work drained; native roots stay retained.
message ModelSourceControlCall {
  Claim claim = 1;
  string operation_id = 2;
  bytes source_selection_digest = 3;
  uint64 control_revision = 4;
  bool paused = 5;
}
message ModelSourceControlResult {
  string operation_id = 1;
  bytes source_selection_digest = 2;
  uint64 control_revision = 3;
  bool paused = 4;
}
message NumericalEnvironmentCall { Claim claim = 1; }
message NumericalEnvironmentResult { bytes digest = 1; }

message DerivedRetentionCall {
  Claim claim = 1;
  DerivedRetentionRequest request = 2;
}

message DerivedRetentionRequest {
  string weights_transaction_id = 1;
  bytes tensorfs_receipt_digest = 2;
  string retention_id = 3;
}

message DerivedRetentionResult {
  string weights_transaction_id = 1;
  bytes tensorfs_receipt_digest = 2;
  string retention_id = 3;
  Ref manifest = 4; // absent only when release won before retention existed
  bool released = 5;
}

// Release the original retained result only after dependent requests have
// independently acquired custody. This does not rewrite its first finalization
// decision or native receipt, and does not release independent retention roots.
message DerivedResultReleaseCall {
  Claim claim = 1;
  DerivedResultReleaseRequest request = 2;
}
message DerivedResultReleaseRequest {
  string weights_transaction_id = 1;
  bytes tensorfs_receipt_digest = 2;
}
message DerivedResultReleaseResult {
  string weights_transaction_id = 1;
  bytes tensorfs_receipt_digest = 2;
  bool released = 3;
}

// The trusted RecordOwner computes this key from the frozen operation, its
// content inputs/parameters and measured numerical environment. No result bytes
// or cache namespace are supplied: the Host verifies its own successful terminal.
message RecordOperationResultCall {
  Claim claim = 1;
  bytes computation_digest = 2;
  string request_id = 3;
  uint64 attempt_ordinal = 4;
  bytes invocation_spec_digest = 5;
  string outcome_id = 6;
  bytes outcome_digest = 7;
}
message RecordOperationResultResult {
  bytes computation_digest = 1;
  bool recorded = 2;
}

// consumer_request_id is an ownership recipient, never part of the computation
// key. A hit acquires its independent native roots before returning. Replay is
// bound to that recipient even if the cache entry is subsequently evicted.
message LookupOperationCall {
  Claim claim = 1;
  bytes computation_digest = 2;
  string consumer_request_id = 3;
}
message LookupOperationResult {
  bytes computation_digest = 1;
  bool found = 2;
  AttemptOutcome source = 3;
  repeated DerivedRetentionResult retentions = 4;
  string consumer_request_id = 5;
  repeated NativeByteRetentionResult byte_retentions = 7; // combined recipient count <=32
}

// Explicit workspace maintenance releases only unused cache-owned roots.
// Live request/lookup roots and active native readers remain authoritative.
message PruneOperationCacheCall { Claim claim = 1; }
message PruneOperationCacheResult {
  uint32 removed_entries = 1;
  uint64 reclaimed_bytes = 2;
  bool store_busy = 3; // root pruning completed; native byte collection deferred
}
message CollectStoreGarbageRequest {}
message CollectStoreGarbageResult {
  uint64 reclaimed_bytes = 1;
  bool store_busy = 2;
}

message ReleaseModelSourceResult {
  string operation_id = 1;
  bool released = 2;
}

// The signed owner adopts retained source work into a different ordinary request
// on this pod. Both operations must declare the same exact source selection;
// TensorFS independently validates the old checkpoint chain and newly derived
// profile plan, creates a new operation chain, and retains its roots before the
// old owner may release. No provider reads or incomplete conversion starts here.
message ModelSourceAdoptCall {
  Claim claim = 1;
  string from_operation_id = 2;
  ModelSourcePrepareRequest request = 3;
}

message CheckpointPageCall {
  Claim claim = 1;
  CheckpointPageRequest request = 2;
}

message CheckpointTransferCall {
  Claim claim = 1;
  CheckpointTransferRequest request = 2;
}

// Creator uploads private wheels directly over this dedicated PodHost
// byte stream. Code never enters WorkerControl or a Tensorhub publication/store.
// Header is first and occurs exactly once. Host reserves the exact file and
// replies with its durable received_bytes before accepting chunks. Each chunk
// starts at that exact offset, is at most 1 MiB, and receives a durable progress
// response. VERIFIED follows complete file digest verification. Disconnect keeps
// the prefix; replay the header to learn the resume offset. Existing operation
// file/count/aggregate limits and PrepareLocalPackage remain the custody contract.
message LocalPackageUploadFrame {
  oneof body {
    LocalPackageUploadHeader header = 1;
    LocalPackageUploadChunk chunk = 2;
  }
}

message LocalPackageUploadHeader {
  Claim claim = 1;
  string operation_id = 2;
  reserved 3;
  reserved "source_digest";
  LocalPackageFileRef file = 4;
}

message LocalPackageUploadChunk {
  uint64 offset = 1;
  bytes data = 2;
}

// The loopback form of PreparePackageSetCall. The retired per-file handoff
// (`LocalDownloadFile` with `LocalDownloadKind` PROJECT_WHEEL/DEPENDENCY_WHEEL/MODEL_MANIFEST/
// MODEL_OBJECT/PACKAGE_INTERFACE) is DELETED, not renamed; the names must not return. Runtime
// preparation no longer receives files whose final owner is TensorFS or the package
// index/install materializer.
message PreparePackageSetRequest {
  reserved 2, 3;
  reserved "files", "environment_root";
  bytes download_delegation = 1;       // exact canonical DownloadDelegation/1 bytes
  string application = 4;              // as PreparePackageSetCall fields 3-6
  repeated string model_slot_paths = 5;
  ImageInventory image_inventory = 6;
  bytes locked_requirements = 7;
  string install_root = 8;             // absolute immutable install destination
  // The delegation's other half. The same 64-byte Ed25519 signature by the rental
  // Creator key that DesiredPackageSet.download_delegation_signature carries, forwarded
  // unchanged by the pod host. Runtime's TensorFS presents `delegation <payload> <signature>`
  // as its hub credential on the tensorfs closure and presign routes; the payload alone does
  // not authenticate.
  bytes download_delegation_signature = 9;
  // Declared PEP 440 Python range and optional exact captured version.
  // Worker intersects these with its installed rolling supported window before install.
  string python_requires = 10;
  string python_version = 11;
  // PreparePackageSetCall.package_interface, forwarded unchanged by PodHost.
  bytes package_interface = 12;
  // Additive: the Host is still landing this set's models in the Store. Runtime installs the
  // release, reads its interface and starts that installation's warm phase (executor start,
  // kernel probes); it reads no model and answers installed_package only. The Host calls
  // again without it once every model is verified in the Store.
  bool models_landing = 13;
  // Wire 67: as PreparePackageSetCall.hub.
  string hub = 14;
}

// The placed worker image's pinned inventory (`tensorhub.image_inventory/1` facts). The list
// the image was built from describes reuse opportunities. Package dependencies are
// installed into their own isolated environment; an inventory version is not a
// constraint on that environment. Native/platform compatibility is checked separately.
message ImageInventory {
  string profile = 1;                  // the registered base image profile
  string python = 2;                   // exact interpreter version the image ships
  repeated ImageDistribution distributions = 3;  // sorted unique by distribution;
                                       // <= MaxImageInventoryDistributions
  repeated PythonInterpreter interpreters = 4; // installed execution versions, sorted unique

}

// Observed standard CPython execution interpreter; paths remain worker-local.
message PythonInterpreter {
  string version = 1; // exact major.minor.patch
  string abi = 2;     // cp312, cp313, cp314
}

message ImageDistribution {
  string distribution = 1;             // normalized lowercase distribution name
  string version = 2;                  // the exact == pin the image promises
}

message PreparePackageSetResult {
  DesiredPlacementSet placement_set = 1;
  InstalledPackage installed_package = 2;
}

// Loopback-only source or wheel installation. Host resolves each operation-scoped
// carrier to a local path. Source archives contain the project and its relocated
// editable dependencies; uv owns dependency resolution and ordinary wheel integrity.
message PrepareLocalPackageRequest {
  reserved 3, 4;
  reserved "environment_root", "wheels";
  string operation_id = 1;
  DevelopmentPackage package = 2;
  // Replays use operation_id and the retained installation, never package contents.
  repeated LocalPackageFile files = 5; // sorted unique by filename; <= MaxLocalPackageFiles
  string install_root = 6;               // absolute immutable install destination
  // Optional registry dependency selection, byte-identical to the
  // DesiredLocalPackageSet input; <= MaxLockedRequirementsBytes. Standard hashed
  // requirements rows, using the published installer grammar. No credentials,
  // floating versions or local paths; no distribution may also be in wheels.
  bytes dependency_requirements = 7;
  // Declared PEP 440 Python range and optional exact captured version.
  // Worker intersects these with its installed rolling supported window before install.
  string python_requires = 8;
  string python_version = 9;
  string source_archive = 10; // filename in files; extracted project for ordinary uv sync
  // Wire 69: the explicit scoped Hub selected by PrepareLocalPackageCall.
  string hub = 11;
}

message LocalPackageFile {
  bytes digest = 1; // normal wheel integrity only; empty for source_archive
  string filename = 2;
  uint64 length = 3;
  string path = 4;                     // absolute verified supervisor-owned file
}

// Loopback-only model binding for an already installed package. TensorFS owns
// model custody; installation_id selects Runtime's retained environment.
message PreparePrivatePlacementRequest {
  reserved 4;
  reserved "files";
  string operation_id = 1;
  reserved 2;
  reserved "local_revision_digest";
  bytes download_delegation = 3; // exact model-only canonical DownloadDelegation/1 bytes
  // The same 64-byte Ed25519 signature by the rental Creator key that
  // DesiredPrivatePlacementSet.download_delegation_signature carries, forwarded unchanged by the
  // pod host so Runtime's TensorFS can present `delegation <payload> <signature>` to the hub's
  // tensorfs routes.
  bytes download_delegation_signature = 5;
  // Native bindings are already retained in the worker's Store and never cause a registry
  // query or download. download_delegation may independently bind other slots in the same
  // set. The combined selection must name each declared slot at most once.
  repeated NativeModelBinding native_models = 6;
  // Required in the native arm: exact existing outer PodHost Claim. Runtime verifies
  // its current owner/epoch and proof before every native custody lookup or cached reply.
  Claim claim = 7;
  string installation_id = 8;
  // Wire 70: caller selections resolved by Runtime before returning the fixed serving
  // binding. These override the corresponding base slot without changing its custody.
  repeated ModelChoice model_choices = 9;
  repeated SourceCredential source_credentials = 10; // memory-only, never retained or logged
  string hub = 11; // selects an existing scoped grant, never confers authority
  string owner = 12; // account for unpublished org-relative model defaults
}

message LocalModelSourceFile {
  string member = 1;    // safe relative provider member, <= MaxModelSourceMemberBytes
  string object_id = 2; // lowercase sha256:<64 hex>
  uint64 length = 3;
  string path = 4; // absolute supervisor-owned payload destination; may be absent until verified
  string header_path = 5; // absolute supervisor-owned bounded header file; loopback only
  bool verified = 6; // this exact full payload has passed supervisor digest/length admission
}

message ModelSourceProfile {
  string slot = 1;
  string profile = 2;
}

message PreparedModelSource {
  reserved 4;
  reserved "checkpoint_evidence_canonical_bytes";
  string slot = 1;
  string profile = 2;
  Ref manifest = 3;
}

// A TensorFS-authored conversion checkpoint, not a new manifest or a publication receipt.
// The head binds the plan and a chain of immutable object refs. bytes is cumulative LOCAL
// checkpointed progress; it becomes remotely durable only after the record owner confirms
// custody of the head and its entire referenced prefix. A replacement pod receives only an
// acknowledged durable head and restores it through ordinary TensorFS admission.
message ModelSourceCheckpoint {
  string slot = 1;
  Ref head = 2;
  bytes plan_digest = 3; // exact SHA-256, 32 bytes
  uint64 index = 4;
  uint64 bytes = 5;
}

// Source and derived-output authority remain disjoint even though their immutable Link
// transport is identical. The authenticated host validates exactly one subject before
// forwarding; Runtime validates the corresponding operation/slot/plan against TensorFS.
message SourceCheckpointSubject {
  string operation_id = 1;
  bytes source_selection_digest = 2;
  string slot = 3;
}

message WeightsCheckpointSubject {
  string request_id = 1;
  bytes invocation_spec_digest = 2;
  string output_slot = 3;
  string weights_transaction_id = 4; // supplied by Runtime, never derived by the host
  uint64 writer_epoch = 5;
  bytes tensorfs_declaration_digest = 6;
}

message CheckpointSubject {
  oneof kind {
    SourceCheckpointSubject source = 1;
    WeightsCheckpointSubject weights = 2;
  }
}

message CheckpointObject {
  Ref ref = 1;
  bool manifest = 2; // false is a blob; true is the manifest namespace
}

// Inspect ONE immutable checkpoint Link, in bounded pages. TensorFS verifies operation,
// slot and plan against the Link; no caller-provided object inventory becomes authority.
message CheckpointPageRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  reserved 6, 7;
  CheckpointSubject subject = 5;
  bytes plan_digest = 8;
  Ref head = 9;
  uint32 offset = 10;
  uint32 limit = 11; // 1..MaxCheckpointObjects
}

message CheckpointPageResult {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  reserved 6, 7;
  CheckpointSubject subject = 5;
  bytes plan_digest = 8;
  Ref head = 9;
  uint64 index = 10;
  uint64 bytes = 11; // local cumulative checkpointed bytes, not remote custody
  Ref previous = 12; // absent at the root Link
  Ref progress = 13; // the immutable source journal or derived accepted-part snapshot
  repeated CheckpointObject objects = 14; // <= MaxCheckpointObjects
  uint32 next_offset = 15;
  bool has_more = 16;
  string safe_code = 17; // nonempty means refused; no partial success then
  string safe_detail = 18;
}

// One grant for one object under an exact checkpoint Link. A GET may first restore the
// named head itself, after which TensorFS validates that Link before exposing its members.
// Every other object must be a member, predecessor or progress ref of the admitted Link.
// Capabilities stay in memory; host/owner ledgers retain only identity and measured results.
message CheckpointTransferRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  reserved 6, 7;
  CheckpointSubject subject = 5;
  bytes plan_digest = 8;
  Ref head = 9;
  CheckpointObject object = 10;
  string transfer_id = 11;
  uint64 grant_revision = 12;
  oneof decision {
    WeightsUploadGrant upload_grant = 13;
    string download_url = 14; // one scoped GET; digest and length come from object
  }
}

message CheckpointTransferStatus {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  reserved 6, 7;
  CheckpointSubject subject = 5;
  bytes plan_digest = 8;
  Ref head = 9;
  CheckpointObject object = 10;
  string transfer_id = 11;
  uint64 grant_revision = 12;
  WeightsTransferState state = 13; // GET success is HELD (verified local admission)
  uint64 transferred_bytes = 14;
  uint32 http_status = 15;
  string checksum_sha256 = 16; // digest proven by local admission/read verification
  string safe_code = 17;
  string safe_detail = 18;
}

message PrepareModelSourceRequest {
  string operation_id = 1;
  bytes source_selection_digest = 2;
  repeated ModelSourceProfile profiles = 3; // sorted unique by slot; <= MaxModelSourceProfiles
  repeated LocalModelSourceFile files = 4; // sorted unique by member; <= MaxModelSourceFiles
  string source_uri = 5; // credential-free pinned hf:// or civitai:// provenance
  string declared_license = 6; // bounded printable provenance; empty means undeclared
  repeated ModelSourceCheckpoint checkpoints = 7; // sorted unique by slot; admitted restore heads
  string adopt_from_operation_id = 8; // signed Host adoption only; never an executor choice
}

message PrepareModelSourceResult {
  ModelSourcePrepareOutcome outcome = 1;
  repeated PreparedModelSource sources = 2; // sorted unique completed slots; exact set when complete
  string safe_code = 3;
  string safe_detail = 4;
  repeated ModelSourceCheckpoint checkpoints = 5; // sorted unique by slot, <= MaxModelSourceProfiles
  repeated string spent_members = 6; // sorted unique verified carriers no remaining conversion uses
}

// ---------------------------------------------------------------------------
// Envelopes. Fence fields 1-3 are literal fields on every message (see header), never nested.
// ---------------------------------------------------------------------------

message RecordOwnerFrame {              // was OwnerFrame (#481: bare "owner" retired)
  reserved 14, 16, 18;                  // purge_command; retired artifact grant/delegation lanes
  reserved 24;                          // private_package_file_chunk -- the th-094 byte relay
  reserved "artifact_grant_update", "ensure_artifacts", "private_package_file_chunk";
  reserved 19, 21, 26, 27;              // no sender; RuntimeWeights.Upload replaced 26
  reserved "weights_host_ack", "weights_read_request", "weights_upload_request",
           "local_package_fetch_request"; // LocalPackageUpload carries local wheels
  // Execution moved to the machine-execution RPCs; the owner's Host and source lanes to PodHost.
  reserved 7, 8, 9, 10, 17, 20, 22, 23, 25, 28, 29, 30, 31;
  reserved "attempt_offer", "cancel_attempt", "outcome_ack", "checkpoint_receipt",
           "weights_finalize_request", "weights_transfer_request", "model_source_file_request",
           "model_source_prepare_request", "local_package_abort", "child_call_result",
           "native_source_command", "native_artifact_transfer", "weights_transaction_refused";
  oneof msg {
    Claim               claim                 = 5;
    DesiredWorkerState  desired_state         = 6;
    SnapshotAck         snapshot_ack          = 11;
  }
}

message WorkerFrame {
  reserved 13;                          // SnapshotEnd — consolidated into WorkerSnapshot (§5)
  reserved 14;                          // purge_report — the purge reservation (header note)
  reserved 15;                          // SnapshotEntry — consolidated into WorkerSnapshot (§5)
  reserved 19, 23, 25;                  // no reader; RuntimeWeights.Upload answers uploads
  reserved "weights_read_result", "weights_upload_result", "local_package_file_status";
  // Execution moved to the machine-execution RPCs; the owner's Host and source lanes to PodHost.
  reserved 7, 8, 10, 11, 16, 17, 18, 20, 21, 22, 24, 26, 27, 28, 29, 30, 31;
  reserved "attempt_accepted", "attempt_outcome", "checkpoint_request", "checkpoint_ack",
           "weights_finalize_result", "weights_intent", "weights_receipt", "weights_transfer_status",
           "model_source_file_status", "model_source_prepared", "local_package_abort_status",
           "weights_checkpoint", "weights_transaction", "child_call_request", "child_call_cancel",
           "native_source_status", "native_artifact_transfer_status";
  oneof msg {
    ClaimAck             claim_ack       = 5;
    ObservedWorkerState  observed_state  = 6;
    // Valid as the stream's ONLY substantive reply: the boot-fatal verdict INSTEAD OF ClaimAck.
    BootFailure          boot_failure    = 9;
    WorkerSnapshot       snapshot        = 12;
  }
}

// An ordinary package call, not a graph or a second request protocol.
// The parent request owns the index; this attempt only re-establishes it. The
// owner resolves the exact target from the parent's frozen interface dependency
// join and durably accepts an ordinary child request before dispatching it.
// intent_digest = SHA256(JCS({module, export,
// request: <decoded request_canonical_bytes>})). It omits parent/attempt clocks;
// the full parent identity below independently fences transport and replay.
// When capture is present, include capture: <its canonical object> in
// that intent preimage. Absence preserves the pre-capture intent identity.
message ChildCallRequest {
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string parent_request_id = 4;
  uint64 parent_attempt_ordinal = 5;
  bytes parent_invocation_spec_digest = 6;
  // Monotone uint32 lifetime index, never reused within the parent request.
  // At most MaxActiveChildCalls reserved/nonterminal calls; completed calls no longer
  // spend that concurrency bound. Exhausting uint32 refuses rather than wrapping.
  uint32 call_index = 7;
  reserved 8;
  reserved "interface_digest";
  string module = 9;
  string export = 10;
  bytes request_canonical_bytes = 11; // bounded 48 KiB; typed refs, never inline artifacts
  bytes intent_digest = 12;
  ActivationCapture capture = 13; // present options participate in intent_digest
}

enum ChildCallState {
  CHILD_CALL_STATE_UNSPECIFIED = 0;
  CHILD_CALL_STATE_PENDING = 1; // owner durably accepted; child may be queued or running
  CHILD_CALL_STATE_SUCCEEDED = 2;
  CHILD_CALL_STATE_REFUSED = 3;
  CHILD_CALL_STATE_FAILED = 4;
  CHILD_CALL_STATE_CANCELED = 5;
}

message ChildCallResult {
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string parent_request_id = 4;
  uint64 parent_attempt_ordinal = 5;
  bytes parent_invocation_spec_digest = 6;
  uint32 call_index = 7;
  bytes intent_digest = 8;
  string child_request_id = 9; // absent only for refusal before durable acceptance
  ChildCallState state = 10;
  bytes result_canonical_bytes = 11; // SUCCEEDED only; bounded 48 KiB
  string safe_code = 12;
  string safe_detail = 13; // bounded 1024 bytes; no remote traceback
  // At most MaxChildArtifactGrants TOTAL, including optional runtime.capture.
  // Grants are visible only after independent native retention; no payload bytes.
  repeated ChildByteResultGrant byte_result_grants = 14;
  ExecutionObservation observation = 15; // observer facts, no result DTO wrapper
}

// Fixed native source services share the ordinary parent-call identity and
// control transport. They are never package builds or a generic privileged RPC registry.
// RESOLVE performs metadata only. The owner durably records the exact selection before
// EXECUTE can move source payloads. Reattachment preserves service_id across attempts.
enum NativeSourcePhase {
  NATIVE_SOURCE_PHASE_UNSPECIFIED = 0;
  NATIVE_SOURCE_PHASE_RESOLVE = 1;
  NATIVE_SOURCE_PHASE_EXECUTE = 2;
  NATIVE_SOURCE_PHASE_CANCEL = 3;
}
enum NativeSourceOperation {
  NATIVE_SOURCE_OPERATION_UNSPECIFIED = 0;
  NATIVE_SOURCE_OPERATION_HUGGINGFACE = 1;
  NATIVE_SOURCE_OPERATION_CIVITAI = 2;
  NATIVE_SOURCE_OPERATION_CONVERT = 3;
  NATIVE_SOURCE_OPERATION_SOURCE_FILES = 4; // bounded readonly ordinary-source view
  NATIVE_SOURCE_OPERATION_COMMIT_FILE = 5; // explicitly complete one own pending file
}
message NativeSourceMember {
  string member = 1;
  Ref object = 2;
  string url = 3; // ephemeral delivery authority; never content identity or public history
}
message NativeSourceSelection {
  string canonical = 1;
  bytes selection_digest = 2; // accepted provider provenance
  Ref content_manifest = 3; // ordinary-file content identity, independent of origin
  repeated NativeSourceMember members = 4; // exact sorted roster; <=4096 and frame byte cap
  repeated string allowed_hosts = 5;
  repeated string credential_hosts = 6;
}
message NativeSourceCommand {
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  ChildCallRequest parent_call = 4; // exact original call; current attempt independently fenced
  string service_id = 5;
  NativeSourceOperation operation = 6;
  NativeSourcePhase phase = 7;
  NativeSourceSelection selection = 8; // EXECUTE downloads only; immutable accepted pin
  string credential = 9; // scoped provider credential; never logs, receipts or workspace rows
}
enum NativeSourceState {
  NATIVE_SOURCE_STATE_UNSPECIFIED = 0;
  NATIVE_SOURCE_STATE_RESOLVED = 1;
  NATIVE_SOURCE_STATE_SUCCEEDED = 2;
  NATIVE_SOURCE_STATE_FAILED = 3;
  NATIVE_SOURCE_STATE_CANCELED = 4;
}
message NativeSourceStatus {
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string parent_request_id = 4;
  uint64 parent_attempt_ordinal = 5;
  bytes parent_invocation_spec_digest = 6;
  uint32 call_index = 7;
  bytes intent_digest = 8;
  string service_id = 9;
  NativeSourceState state = 10;
  NativeSourceSelection selection = 11; // RESOLVED only
  bytes result_canonical_bytes = 12; // SUCCEEDED only, <=48KiB
  string safe_code = 13;
  string safe_detail = 14; // bounded, excludes credential/URL/remote traceback
  bytes native_receipt_canonical_bytes = 15; // actual native result, bounded by existing receipt cap
  bytes computation_digest = 16;
  bool memo_hit = 17; // observation, excluded from semantic result
  NativeByteTreeRef byte_output = 18; // SOURCE_FILES or COMMIT_FILE/SUCCEEDED; parent-owned bytes
  uint64 byte_output_attempt_ordinal = 19; // original producer attempt, possibly before reply correlation
  bytes byte_output_invocation_spec_digest = 20; // exact original parent producer spec; 32 bytes
}

// ---------------------------------------------------------------------------
// Claim / ClaimAck — ownership establishment. The worker's identity rides the REPLY because the
// RecordOwner dials.
// ---------------------------------------------------------------------------

message Claim {
  reserved 4, 9;                     // retired: executor_incarnation, wire_schema_digest
  reserved "wire_schema_digest";
  uint64 record_owner_epoch = 1;     // envelope; the claimed authority epoch
  uint64 control_stream_epoch = 2;   // 0 on Claim (none minted yet)
  string worker_boot_id = 3;         // empty on a fresh dial; set when re-dialing a known boot
  string record_owner_id = 5;        // stable identity of the claiming RecordOwner
  string worker_id = 6;              // the worker identity the RecordOwner expects to be claiming
  uint32 wire_minor = 7;             // highest minor the RECORDOWNER implements
  bytes proof = 8;                   // 64-byte Ed25519 signature over canonical ClaimProof/1 on
                                     // the private rental lane; other owner classes retain their
                                     // transport-specific authority proof
}

// DOCUMENT SHAPE (not a wire message): canonical form `cozy.worker.v1.ClaimProof/1`.
// The Cozy daemon signs these exact reconstructed bytes with the rental key before its first
// Claim. There is no challenge, timestamp, jti, or application request-signature grammar: epoch,
// boot, worker, and exact TLS leaf bind replay to this worker lifetime.
message ClaimProof {
  uint64 record_owner_epoch = 1;
  string worker_boot_id = 2;
  string worker_id = 3;
  bytes worker_tls_certificate_digest = 4;
}

// Claim proof is evaluated before readiness or ownership mutation. A bad proof answers
// UNAUTHENTICATED even before ready. A valid proof while the worker's post-bind readiness barrier
// is closed answers UNDURABLE without minting a control_stream_epoch. On acceptance the worker
// fences the previous stream (if any), increments control_stream_epoch, and answers with its
// identity + one WorkerSnapshot. DISPATCH STAYS CLOSED until the RecordOwner's SnapshotAck
// (02 §6) — admission_state reports CLOSED until then.
message ClaimAck {
  reserved 4, 14;                    // retired: executor_incarnation, wire_schema_digest
  reserved "wire_schema_digest";
  uint64 record_owner_epoch = 1;     // echo of the accepted epoch
  uint64 control_stream_epoch = 2;   // newly minted for this stream
  string worker_boot_id = 3;         // this boot's identity
  bool accepted = 5;                 // false => `rejection` set; stream then closes
  ClaimRejection rejection = 6;
  uint32 wire_minor = 7;             // highest minor the WORKER implements
  string worker_id = 8;              // CREDENTIAL subject; cross-checked vs the worker's server
                                     // identity (02 §4)
  string worker_instance_id = 9;     // ONE provisioned instance lifetime; outcome-replay
                                     // authorization keys on this, never worker_id
  string worker_release_id = 10;
  string control_runtime_digest = 11; // class (b), `sha256:<hex>`: exact image-owned control
                                     // Runtime wheel bytes measured from the installed wheelhouse.
                                     // It is NOT the OCI image identity: an image cannot bake its
                                     // own manifest digest without a self-reference. The provisioner
                                     // independently verifies the selected immutable OCI identity;
                                     // a RecordOwner needs BOTH facts to admit the machine.
  string git_commit = 12;
  WorkerResources resources = 13;    // torch-free worker statics; never re-sent mid-stream.
                                     // Capability qualification is NOT here: it arrives
                                     // per-placement (PlacementStatus.accelerator).
  // Runtime keeps this owner for the boot across Host and Runtime restarts: an owner presents
  // its Claim on later calls without Claiming the boot again.
  reserved 15;
  reserved "claim_survives_restart";
}

// Authenticated boot-fatal delivery: the worker accepted a stream but cannot serve.
message BootFailure {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string worker_id = 5;
  string worker_instance_id = 6;
  BootFailureReason reason = 7;
  string detail = 8;                 // bounded <= 1024 bytes, sanitized
  WorkerResources resources = 9;     // whatever was measurable
  string control_runtime_digest = 10; // same measured control Runtime provenance as ClaimAck 11
  string worker_release_id = 11;
}

// ---------------------------------------------------------------------------
// The recovery snapshot — ONE bounded, digest-acknowledged document (§5; was
// SnapshotBegin/SnapshotEntry/SnapshotEnd). The three-message form could only be bounded by a
// counted-entries check; a single canonical document is bounded by its own digest, and a
// truncated snapshot cannot match. Sent by the worker after ClaimAck and after any
// reconnect-with-new-epoch. Dispatch stays CLOSED until the RecordOwner durably reconciles
// and acknowledges snapshot_id + snapshot_digest.
// ---------------------------------------------------------------------------

message WorkerSnapshot {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string snapshot_id = 5;            // worker-minted; names this exact snapshot
  bytes snapshot_digest = 6;         // class (a): sha256 over EXACTLY the bytes in 7
  bytes snapshot_canonical_bytes = 7;  // the WorkerSnapshotBody DOCUMENT, canonical JSON bytes
  bytes accepted_placement_set_canonical_bytes = 8;  // the EXACT accepted set bytes as journaled
                                     // — never a re-serialization; its digest lives INSIDE 7
  // THE HOST'S OWN DOCUMENT (proto-025). A canonical document under a digest cannot be appended
  // to -- any addition re-authors it -- so a host standing between the RecordOwner and the
  // worker gets a second document beside the worker's, and 6/7 pass through BYTE-IDENTICAL.
  // Both empty when no host stands between them (local execution).
  bytes host_snapshot_digest = 9;    // class (a): sha256 over EXACTLY the bytes in 10
  bytes host_snapshot_canonical_bytes = 10;  // the HostSnapshotBody DOCUMENT, canonical JSON
}

// DOCUMENT SHAPE (not a wire message): canonical form `cozy.worker.v1.WorkerSnapshotBody/1`, the
// subject of WorkerSnapshot.snapshot_digest.
//
// NAMING (implementation resolution, rev §5): the rev document calls both the wire message and
// the document `WorkerSnapshot`, which one proto package cannot express. The document takes the
// `Body` suffix, exactly as AttemptOutcome/AttemptOutcomeBody already does, so the wire message
// keeps the name the rev's proto sketch and WorkerFrame slot 12 give it.
//
// BOUNDEDNESS IS STRUCTURAL, NOT A PROMISE (gpu-hot.md §3):
// the post phase is bounded ONE attempt per lane, so a lane's device takes its next occupant
// only while at most one DEVICE_RELEASED attempt on it is unacked — a RecordOwner that stops
// acking idles its own device rather than growing the worker's held set. Queue room is a
// host-bytes fact (§4) and does not move with acks.
message WorkerSnapshotBody {
  reserved 3, 11;                              // no reader: the host reports its own rows
  reserved "journal_highwater", "weights_transactions";
  uint64 accepted_desired_state_revision = 1;  // durably ACCEPTED intent
  bytes accepted_placement_set_digest = 2;     // class (a); equals sha256 of the bytes the
                                               // enclosing WorkerSnapshot carries in field 8
  WorkerPhase worker_phase = 4;                // machine lifecycle
  repeated PlacementStatus placements = 5;     // sorted by placement_id
  uint64 converged_revision = 6;               // advances ONLY when observed satisfies accepted
  uint64 admission_epoch = 7;
  AdmissionState admission_state = 8;
  uint32 available_attempt_slots = 9;          // Σ lanes[].available_attempt_slots: offers the
                                               // worker will still admit to its queues now
  repeated HeldAttempt held_attempts = 10;     // every accepted attempt from admission to ack
                                               // (QUEUED, RUNNING, DEVICE_RELEASED,
                                               // OUTCOME_PENDING_ACK); sorted by
                                               // (request_id, attempt_ordinal)
  repeated DeviceLane lanes = 12;              // proto-024: the lanes as of this snapshot,
                                               // sorted by lane_id — the per-lane room a
                                               // reconnecting RecordOwner reconciles from,
                                               // beside the worker-level sum in 9; each row
                                               // carries its resident_placement_ids (proto-026)
  repeated string held_manifests = 13;         // proto-026 residency: the same set as
                                               // ObservedWorkerState.held_manifests (27) as of
                                               // this snapshot, so a reconnect starts from facts
}

// DOCUMENT SHAPE (not a wire message): canonical form `cozy.worker.v1.HostSnapshotBody/1`, the
// subject of WorkerSnapshot.host_snapshot_digest. Authored by the pod host from its ledger at
// every worker snapshot; never by the worker.
//
// held_outcomes are the ledger's outcomes pending ack that the worker's own held_attempts does
// NOT name -- the survivor set after a child replacement. Each replays as an AttemptOutcome
// after the barrier, exactly like the worker's own. A live child's held_attempts always covers
// the ledger's, so this list is empty until a child is replaced. weights_transactions announce
// the receipt frames the host replays after the barrier. Lanes that moved to PodHost have no
// post-barrier replay and therefore no row here: the owner asks the host.
message HostSnapshotBody {
  repeated HeldAttempt held_outcomes = 1;  // sorted by (request_id, attempt_ordinal); state is
                                           // always OUTCOME_PENDING_ACK
  repeated WeightsTransactionStatus weights_transactions = 2; // sorted by weights_transaction_id
  uint64 retained_desired_revision = 3; // Host ledger high-water, not Runtime acceptance or convergence.
                                       // Replacement owners issue new intent above this revision.
}

message SnapshotAck {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string snapshot_id = 5;            // echo of the exact snapshot durably reconciled
  bytes snapshot_digest = 6;         // echo; COMPARED, never recomputed by the worker. An ack
                                     // naming a different id/digest is NOT an ack — the barrier
                                     // stays closed and dispatch never opens.
  bytes host_snapshot_digest = 7;    // echo of WorkerSnapshot 9; the host compares it before
                                     // forwarding the ack untouched. Empty when 9 was empty.
}

// ---------------------------------------------------------------------------
// DesiredWorkerState / ObservedWorkerState — the full-replace document pair (#473: the
// desired/observed split, in the names). Serving mode carries the content-addressed
// DesiredPlacementSet; job mode is unchanged. Modes are exclusive per provisioned instance
// generation (#440).
// ---------------------------------------------------------------------------

message DesiredWorkerState {          // was Directive
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  reserved 9;                        // drain_policy — no writer; drain ships as posture + the
                                     // worker's grace constant (future owner th-007)
  reserved 10;                       // retired artifact_grant; exact selected facts now live in
                                     // PlacementSet
  reserved 11;                       // credential — the worker-dials JWT rotation lane, obsolete
                                     // under the RecordOwner-dials orientation (02 §4)
  reserved 12;                       // serving (ServingDirective) — superseded by placement_set
  reserved 16, 17, 18;               // host modes; the owner prepares through PodHost
  reserved "package_set", "local_package_set", "private_placement_set";
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  uint64 revision = 5;               // RecordOwner-owned, monotonic; older ignored, equal
                                     // idempotent, newer applies; equal revision + different
                                     // bytes is a protocol error (02 §3 — now byte-checkable
                                     // rather than claim-checkable)
  Posture posture = 6;
  uint32 wire_minor = 7;             // the minor the RecordOwner speaks on this stream; echoed
  uint64 drain_grace_ms = 8;         // draining posture only: grace before forceful; 0 = the
                                     // worker's runtime-constant default
  oneof mode {
    JobDirective job = 13;
    DesiredPlacementSet placement_set = 15;
  }
  // A supervisor-owned Runtime/TensorFS replacement target. The worker must reject a
  // malformed or unsupported revision before staging bytes.
  RuntimeRevision runtime_revision = 19;
}

message DesiredPackageSet {
  bytes download_delegation = 1;            // exact canonical DownloadDelegation/1 bytes
  bytes download_delegation_signature = 2;  // 64-byte Ed25519 signature by the rental Creator key
}

// An operation-scoped private install. Code transfers directly to the worker.
// Source files have no fingerprint; ordinary wheel artifacts retain uv integrity.
message DesiredLocalPackageSet {
  string operation_id = 1;
  DevelopmentPackage package = 2;
  repeated LocalPackageFileRef files = 3; // sorted uniquely by filename
  // Optional ordinary locked requirements for wheel-only installs.
  bytes dependency_requirements = 4; // <= MaxLockedRequirementsBytes
  // Declared PEP 440 Python range and optional exact captured version.
  // Worker intersects these with its installed rolling supported window before install.
  string python_requires = 5;
  string python_version = 6;
  string source_archive = 7; // filename in files; root contains pyproject.toml and uv.lock
}

// Bind selected models to an existing installation. The model-only delegation
// authorizes downloads; it is independent of package content.
message DesiredPrivatePlacementSet {
  string operation_id = 1;
  reserved 2;
  reserved "local_revision_digest";
  bytes download_delegation = 3;
  bytes download_delegation_signature = 4; // 64-byte Ed25519 signature by rental Creator key
  // These retained slots and the download set must be disjoint.
  repeated NativeModelBinding native_models = 5;
  string installation_id = 6;
  // Wire 70: forwarded unchanged to Runtime's PreparePrivatePlacementRequest. A sender
  // relying on these fields requires a wire-70 Host and Runtime.model_overrides.
  repeated ModelChoice model_choices = 7;
  repeated SourceCredential source_credentials = 8; // memory-only, excluded from identity
  string hub = 9;
  string owner = 10;
}

// A private model already retained for this owner. Sorted uniquely by full slot
// path, 1..MaxModelSlotPaths rows. Runtime verifies the exact live retention before using
// any cached preparation; release of an equal retention ID cannot replay a stale success.
// The label is provenance/display only; manifest and retention are the byte authority.
message NativeModelBinding {
  string slot = 1;       // full declared <entrypoint>.models.<parameter> path
  string model = 2;      // existing private producer/output label, never a fetch address
  Ref manifest = 3;     // exact SHA-256 and positive canonical manifest length
  DerivedRetentionRequest retention = 4;
  repeated DownloadAdapterRef adapters = 5; // ordinary adapter checkpoints; base custody stays native.
}

message LocalPackageFileRef {
  reserved 3;
  reserved "kind";
  bytes digest = 1; // ordinary wheel integrity only; empty for source_archive
  string filename = 2;
  uint64 length = 4;
}

// The serving-mode desired state, GENUINELY content-addressed (§4; was DeploymentSetDirective).
// The one-digester ECHO is replaced by a byte fence in the exact shape InvocationSpec already
// uses, and the duplicate structured representation is DELETED — there is no second place for
// the set to disagree with itself.
//
// ORDER OF OPERATIONS, NON-NEGOTIABLE: recompute sha256(placement_set_canonical_bytes) and
// compare BEFORE parsing a single field; on match, journal the EXACT accepted bytes and their
// digest (never a re-serialization, never a structured projection); only then parse under
// unknown-field refusal. Recovery, status attribution, and the snapshot all quote the journaled
// bytes. A mismatch is FAULT_KIND_PLACEMENT_SET_DIGEST_MISMATCH, UNAPPLIED, with
// accepted_desired_state_revision NOT advancing and the previous set still serving.
message DesiredPlacementSet {
  reserved 2;                        // the duplicate structured PlacementSet — DELETED (§4)
  bytes placement_set_digest = 1;    // class (a): sha256 over EXACTLY the bytes in 3
  bytes placement_set_canonical_bytes = 3;  // the PlacementSet DOCUMENT, canonical JSON bytes
  repeated PlacementDevicePin device_pins = 4;  // proto-024: sorted unique by placement_id;
                                     // absent for a placement ⇒ the worker assigns a 1-device
                                     // lane by measured fit. OUTSIDE the digest on purpose.
  // One unchanged CPU orchestration parent may coexist with serving children.
  // Operational, outside PlacementSet bytes/digest, like device_pins. Requires
  // orchestration=true, device_count=0, no device request/memory and no nested parent;
  // Runtime also verifies its actual frozen job interface has no Model/Weights capability.
  JobDirective orchestration_parent = 5;
  // Machine executions only (MachineExecutionSubmit.prepared_state): the exact width of the
  // device group Runtime grants the offered placement; Runtime picks the ordinals. Zero lets
  // Runtime choose the widest degree every model slot declares. Operational and outside the
  // digest, like device_pins.
  uint32 execution_gpus = 6;
}

// Where a placement sits on THIS worker (proto-024). Ordinals are envelope-local (the worker's
// `--devices` order) and sorted unique; K > 1 pins the placement to a GROUP lane whose ONE
// executor is sealed to all K devices and whose construction must be declared for degree K.
// The pin is part of neither placement-set identity nor invocation identity; re-pinning is a
// new desired-state revision over the SAME bytes. A pin the worker cannot honour — an ordinal
// outside the envelope, a device another placement holds, a fit that fails, a package with no
// construction declared for K — is a typed placement fault (FAULT_KIND_CONFIG_REFUSED, reason
// `device_pin_infeasible` / `device_group_unsupported`); other placements are untouched.
message PlacementDevicePin {
  string placement_id = 1;           // must name one placement in placement_set_canonical_bytes
  repeated uint32 device_ordinals = 2;  // K >= 1, sorted unique, envelope-local
}

// DOCUMENT SHAPE (not a wire message): canonical form `cozy.worker.v1.PlacementSet/1`.
// Placements sorted by placement_id. One placement per package; a placement holds every
// construction its slots bind.
message PlacementSet {
  repeated Placement placements = 1;
}

// DOCUMENT SHAPE: canonical `cozy.worker.v1.DownloadDelegation/1`. Creator signs the exact
// canonical bytes. Replay is intentionally valid until expiry; Tensorhub keeps no nonce state.
message DownloadDelegation {
  reserved 8;
  reserved "held_manifests";
  uint64 expires_at_unix = 1;
  repeated DownloadModelRef models = 2;      // sorted unique by (package,slot,model,release,manifest)
  repeated DownloadPackageRef packages = 3; // sorted unique by (package,release); empty only for
                                             // DesiredPrivatePlacementSet model binding
  string rental_id = 4;
  string worker_boot_id = 5;
  string worker_id = 6;
  bytes worker_tls_certificate_digest = 7;   // sha256 of exact readiness-pinned leaf DER
}

message DownloadModelRef {
  string manifest = 1;                       // sha256:<64 lowercase hex>
  string model = 2;                          // org/name
  string release = 3;                        // immutable author release
  string package = 4;                        // one package named by this delegation
  string slot = 5;                           // exact package-interface model-slot path; unique per package
  string lane = 6;                           // the release lane the manifest was resolved from (e.g.
                                             // bf16, fp8). The manifest is identity; the lane is the
                                             // repository pointer the worker's placement row spells,
                                             // so a pod names the same lane the owner resolved.
  repeated DownloadAdapterRef adapters = 7; // ORDERED per-request stack for this model slot.
}

// A model selection used as an adapter. Download delegations contain exact immutable
// catalog checkpoints; ModelChoice may instead ask the machine to resolve a provider
// source. The selected base component is explicit; no executable adapter code is sent.
message DownloadAdapterRef {
  string component = 1; // empty: infer one compatible base component, refuse if ambiguous
  string model = 2;
  string release = 3;
  string lane = 4;
  string manifest = 5;
  string source_component = 6; // empty selects "adapter"
  string scale = 7; // finite canonical decimal string; empty means 1; zero/negative are valid.
  // Wire 70: immutable provider selection, resolved by the machine using normal model
  // source preparation. Exclusive with model/release/lane/manifest. These choice fields
  // are absent from materialized download delegations, whose manifests are already pinned.
  string source = 8;
  repeated string profiles = 9;
}

message DownloadPackageRef {
  reserved 3;
  reserved "release_digest";
  string package = 1;                        // org/name
  string release = 2;                        // exact semver release
}

message Placement {
  reserved 3, 4, 5, 9, 10;
  reserved "environment_digest", "environment_receipt_digest", "qualification", "environment";
  string placement_id = 1;           // "package-" + hex(sha256(package \0 release))[:24]:
                                     // stable as models are added. Routing + journal key; NEVER
                                     // part of invocation identity (InvocationSpec digests
                                     // exclude it)
  oneof package_mode {
    PackageSelection package = 2;    // installed published release
    DevelopmentPackage development = 11;  // explicit source-checkout execution
  }
  bytes bindings_digest = 6;         // class (a): sha256(canonical JSON of exactly
                                     // {entrypoints:<field 8>,models:<field 7>})
  repeated Model models = 7;         // sorted unique by id; [] for a weightless package
  repeated Entrypoint entrypoints = 8;  // sorted unique by name
  string installation_id = 12;       // worker-owned installed environment lifetime
  bytes package_interface = 13;      // interface discovered in that installed environment
}

// Exact immutable bytes. Nested placement facts use this one reference shape instead of generic
// artifact subjects, role strings, or digest-only pointers.
message Ref {
  bytes digest = 1;
  uint64 length = 2;
}

// A published package is selected by repository and version. uv verifies its
// downloaded wheel artifacts; execution uses Runtime's installed environment.
message PackageSelection {
  reserved 3, 4;
  reserved "release_digest", "project_wheel";
  string package = 1;                // exact org/name package identity
  string release = 2;                // exact semantic release
  string hub = 5;                    // Wire 67: the Tensorhub origin it is read at; empty: the default Hub
}

// Source sync selects an installed generation. Updates do not mutate environments
// retained by running requests. The handle is lifecycle plumbing, not a fingerprint.
message DevelopmentPackage {
  string package = 1;                // exact org/name package identity
  string release = 2;                // exact semantic release
  reserved 3, 4, 5;
  reserved "source_digest", "project_wheel", "local_revision_digest";
  string installation_id = 6;
}

message Model {
  string id = 1;                     // "model-" + hex(sha256(slot_path))[:16]; stable as
                                     // other models are added
  string repo = 2;                   // exact org/name repository identity
  string version = 3;                // exact model release
  string lane = 4;                   // exact selected lane
  Ref manifest = 5;                  // exact TensorFS Manifest; no redundant header reference
}

message Entrypoint {
  string name = 1;
  bytes entrypoint_binding_digest = 2; // sha256(canonical JSON of exactly
                                       // {name:<field 1>,slots:<field 3>})
  repeated Slot slots = 3;           // sorted unique by slot; [] for a weightless entrypoint
}

message Slot {
  reserved 3;
  reserved "config";
  string slot = 1;
  string reference_model_id = 2;     // must name one Placement.models id
  repeated Component components = 4; // ORDERED MCC destination sequence; never sorted
  Ref model_construction_contract = 5; // required for qualified publication; omitted when
                                       // DevelopmentPackage derives it from source + local model
  repeated Stamp stamps = 6;         // sorted unique by (component,key)
  repeated ModelAdapter adapters = 7; // ORDERED; omitted for an unadapted model slot.
}

message ModelAdapter {
  string component = 1;             // one exact Slot.components target, never inferred.
  string model_id = 2;              // ordinary Placement.models row for the adapter snapshot.
  string source_component = 3;      // canonical component holding A/B and optional alpha.
  string scale = 4;                 // finite canonical decimal string, retained in identity.
}

message Component {
  string component = 1;
  string model_id = 2;               // must name one Placement.models id
}

message Stamp {
  string component = 1;              // must name one Slot.components component
  string key = 2;
  repeated string values = 3;        // sorted unique, nonempty
}

message JobDirective {
  reserved 1, 5;
  reserved "build_id", "reclaim_on_terminal";
  string job_descriptor_id = 2;
  ResourceCaps resource_caps = 3;
  PublicationContract publication_contract = 4;
  uint32 device_count = 6;
  // Exactly one CPU orchestration slot may coexist with the serial
  // ordinary job envelope. The selected parent must have frozen interface
  // dependencies, no Model/Weights capabilities, and no device grant.
  bool orchestration = 7;
  // A complete desired state while an ordinary child runs includes its unchanged
  // CPU parent explicitly. Must have orchestration=true and no nested parent;
  // top-level orchestration=true cannot contain this field. This is an admitted
  // job set, never a program or a list of future calls.
  JobDirective orchestration_parent = 8;
  string installation_id = 9;
}

// CONVERGENCE FACTS ON THE WIRE (§8; was Report). `applied_revision` is RETIRED as dishonest —
// it advanced on ACCEPTANCE, so a RecordOwner reading it learned only that its own message
// arrived. Acceptance and convergence are now two separate, checkable facts:
// converged_revision < accepted_desired_state_revision is the normal, visible state of a
// convergence in progress or a latched failure — never an error, always readable.
message ObservedWorkerState {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  reserved 5;                        // applied_revision — RETIRED as dishonest (#473)
  reserved 6;                        // intake_state — machine lifecycle is worker_phase (22)
                                     // now; IntakeState is retired with both of its uses (#482)
  reserved 7;                        // readiness_epoch — moved per-placement by #446 and then
                                     // DELETED by #482/#486b
  reserved 12;                       // serving_capacity — dissolved into PlacementStatus (#446)
  reserved 14;                       // applied_set_digest — split into
                                     // accepted_placement_set_digest (20) vs the convergence
                                     // facts (21)
  reserved 23, 24, 25;               // retired grant/delegation observations
  reserved "applied_artifact_grant_id", "applied_grant_revision", "artifact_intent";
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  uint32 applied_wire_minor = 8;     // stale echo is a visible skew fact, never a refusal
  repeated HeldAttempt held_attempts = 9;  // every accepted attempt from admission to ack:
                                     // QUEUED, RUNNING, DEVICE_RELEASED, OUTCOME_PENDING_ACK
                                     // (proto-026: a queued attempt is no longer absent)
  repeated Fault faults = 10;        // MACHINE-scope faults; placement faults ride their status
  repeated ActivityEvent activity = 11;    // the non-attempt activity lane (durable)
  JobCapacity job_capacity = 13;     // job mode only
  repeated PlacementStatus placements = 15;  // serving mode only; sorted by placement_id

  // The ONE worker-level admission gate (§6). The RecordOwner dispatches against the epoch it
  // last saw; the worker admits only if the echoed epoch is CURRENT, admission_state is OPEN,
  // and a slot is free. A stale epoch refuses DETERMINISTICALLY — same input, same verdict, no
  // race window. Only the epoch FENCES: state and slots say "not accepting" / "full", which is a
  // gate, not a fence against a stale actor.
  uint64 admission_epoch = 16;       // bumps whenever admission MEANING changes: window
                                     // resize, phase change, cutover, lane change. NOT on
                                     // executor respawn (proto-026, gpu-hot D10): a queued
                                     // attempt is bound to no executor, so a respawn
                                     // invalidates nothing it used to; a RUNNING attempt dies
                                     // with its own executor_epoch as before. record_owner_epoch,
                                     // control_stream_epoch and executor_epoch are unchanged.
  AdmissionState admission_state = 17;     // CLOSED is STRUCTURAL (pre-snapshot-barrier,
                                     // draining, mid-cutover); OPEN with zero slots is TRANSIENT
                                     // saturation — a RecordOwner backs off differently for each
  uint32 available_attempt_slots = 18;     // offers this worker will still admit to its lane
                                     // queues now — provably Σ lanes[].available_attempt_slots
                                     // (proto-024/026). NOT a seat count: the device seat is
                                     // the RUNNING held attempt on a lane. A RecordOwner that
                                     // dispatches to a multi-lane worker MUST read lanes: an
                                     // offer for placement P draws only from P's lane.

  uint64 accepted_desired_state_revision = 19;  // durably ACCEPTED intent (advances on
                                     // acceptance — which is all it ever honestly meant)
  bytes accepted_placement_set_digest = 20;     // class (a): the accepted set's digest
  uint64 converged_revision = 21;    // advances ONLY when observed satisfies accepted. It may
                                     // NEVER advance past a placement whose serving state is not
                                     // DISPATCHABLE for a desired spec: the field is a derived
                                     // fact, and a worker that advances it while observed state
                                     // disagrees is in breach, not merely optimistic.
  WorkerPhase worker_phase = 22;     // machine lifecycle, out of the placement enum
  repeated DeviceLane lanes = 26;    // proto-024: every lane, sorted by lane_id; serving mode.
                                     // A 1-device worker reports exactly one lane. Any lane
                                     // change (a group forming or dissolving) bumps
                                     // admission_epoch; structural CLOSED stays a worker fact.
  repeated string held_manifests = 27;  // proto-026 residency (residency-aware-routing.md §2):
                                     // every TensorFS manifest (`sha256:<hex>`, sorted unique)
                                     // whose objects the worker's VERIFIED store holds complete,
                                     // whether or not a current placement uses it. A SET, not
                                     // bytes: changes on acquisition/purge, each emitting a
                                     // state. The orchestrator's on-disk fact for the capacity
                                     // decision ("must download" is never a routing candidate).
}

// ONE serialized resource inside the worker (proto-024/cr-066): a set of envelope-local device
// ordinals, one attempt seat, one ledger, and the placements resident on those devices. Law 8
// (one active attempt per PHYSICAL device) is a lane fact. K == 1 is a device lane; K > 1 is a
// GROUP lane — one executor sealed to all K, the ledger accounting per device, the
// whole executor torn down as a unit (executor_epoch bumps once, every device's rows clear).
// Ordinals are positions in the worker's `--devices` envelope, sorted unique, disjoint across
// lanes.
//
// The lane holds a QUEUE of accepted attempts (proto-026, gpu-hot.md §4) and orders it itself:
// resident tenant first, then co-fitting, then the rest, within an overtake budget each attempt
// carries on HeldAttempt. The device SEAT is not a count here — it is the RUNNING held attempt
// whose lane_id names this lane.
message DeviceLane {
  string lane_id = 1;                // worker-minted, opaque, stable while the lane exists
  repeated uint32 device_ordinals = 2;  // K >= 1
  uint32 available_attempt_slots = 3;   // offers this lane will still ADMIT TO ITS QUEUE now:
                                        // the depth the lane can account for in host bytes
                                        // (declared input + output bounds against the host
                                        // budget, gpu-hot.md §4) minus attempts held. Never a
                                        // constant; never the seat.
  repeated string placement_ids = 4;    // sorted; placements assigned to this lane
  repeated string resident_placement_ids = 5;  // proto-026 residency: placements whose executor
                                        // holds device bytes on this lane NOW — a subset of
                                        // placement_ids, sorted. Changes on fill/vacate, each
                                        // emitting a state. Membership only: no bytes, no
                                        // headroom, no plan — the worker's admission and plan
                                        // arbitration stay the only residency authority.
}

// PER-PLACEMENT TRUTH, on TWO AXES (§8, #473/#482). The frozen wire's single IntakeState cannot
// express "staged on disk but offline" — the exact state an outgoing spec holds under
// fallback-retention — and a single phase cannot represent staged x draining independently.
//
// The axes make #474's fallback-retention expressible: outgoing sits at (STAGED, OFFLINE),
// restorable without a refetch, while incoming sits at (STAGED, ACTIVATING). An activation
// failure restores outgoing to (STAGED, DISPATCHABLE) and LATCHES the failure for that desired
// revision — the worker does not evict-and-retry forever, and converged_revision stays behind
// with the fault typed on the placement.
//
// REPLACEMENT REQUIRES A LIVE FALLBACK (#485c): a placement whose rollback pin is gone — GC'd
// under a bytes/age cap, or never materialized — CANNOT accept a new spec until it
// re-materializes one. Fallback capability is a PRECONDITION of replacement, not a best-effort
// nicety; a cap that evicts the pin thereby PAUSES replacement, recorded as
// FAULT_KIND_FALLBACK_PIN_MISSING, and forcing past it is an explicit administrative act.
message PlacementStatus {
  reserved 2;                        // intake_state — per-placement use retired (#473)
  reserved 3;                        // readiness_epoch — DELETED, not renamed (#482/#486b): the
                                     // serving axis + dispatchable_binding_digests carry what a
                                     // placement can serve, and the worker-level admission_epoch
                                     // carries whether an offer is admissible. One fence, not
                                     // two to keep consistent.
  reserved 5;                        // attempt_credits — replaced by the admission fence (#472e)
  string placement_id = 1;
  uint64 executor_epoch = 4;         // THIS placement's executor fence; bumps on its respawn
  repeated bytes dispatchable_binding_digests = 6;
  repeated bytes materializable_binding_digests = 7;  // DISJOINT from dispatchable
  repeated Fault faults = 8;         // placement-scoped
  AcceleratorQualification accelerator = 9;     // absent = present-but-unqualified
  bytes placement_set_digest = 11;   // class (a): parent desired-set identity. Together with
                                     // placement_id, identifies what this placement holds.
  MaterializationState materialization = 12;    // STAGED asserts the
                                     // exact overlay installed and imported successfully; it is
                                     // unspeakable otherwise
  ServingState serving = 13;
  bytes retained_fallback_placement_set_digest = 14; // class (a): predecessor set kept for restore
                                     // (#474/#485c). Empty means replacement is PAUSED.
  PlacementAcquisitionObservation acquisition = 15;  // OBSERVATION ONLY for this
                                     // placement_set_digest. Never identity, readiness,
                                     // convergence, or admission authority; no acceptance gate
                                     // may read it. Terminal values remain visible after
                                     // STAGED/DISPATCHABLE until the next acquisition for this
                                     // placement starts or the placement leaves observed state.
  reserved 16;
  reserved "package_revision_digest";
  reserved 17;
  reserved "environment_digest";
  reserved 18;
  reserved "config_digest";
  string device_lane_id = 19;          // proto-024: the ObservedWorkerState.lanes[] entry this
                                       // placement's executor is sealed to; empty while
                                       // OFFLINE/ABSENT or before the worker assigned a lane
  repeated bytes loaded_binding_digests = 20;  // sorted unique, a subset of
                                       // dispatchable_binding_digests: constructions built in the
                                       // live executor (resident or parked)
  string installation_id = 21;
}

// Cozy-visible proof of concurrent package/model acquisition and cache reuse. Both legs use
// one process-relative monotonic clock and therefore one origin; they reset with the worker
// process and MUST NOT be compared across worker_boot_id. A leg is absent before it starts. Once
// present its start is non-zero, counters are cumulative and never decrease, and end is zero
// while in progress or >= start when terminal. The two terminal intervals prove overlap exactly.
//
// Scope is deliberately disjoint. `package` counts the desired package overlay bytes needed
// above the base worker image (including its project/custom wheels), excluding model bytes.
// `model` counts the object bytes reached from Placement.models[].manifest. At terminal,
// downloaded_bytes + reused_bytes is the exact reached
// content length for that leg. Downloaded bytes were newly fetched into verified local holdings;
// reused bytes were already verified and held locally. Partial observations carry progress so
// far; terminal counters persist as described on PlacementStatus.
message PlacementAcquisitionObservation {
  AcquisitionLegObservation package = 1;
  AcquisitionLegObservation model = 2;
}

message AcquisitionLegObservation {
  uint64 started_monotonic_ns = 1;   // non-zero; one process-relative clock for both legs
  uint64 ended_monotonic_ns = 2;     // 0 while in progress; terminal iff >= start
  uint64 downloaded_bytes = 3;       // cumulative unique content bytes newly fetched this leg
  uint64 reused_bytes = 4;           // cumulative verified bytes already held before this leg
}

// Executor-probed capability facts (#430: MEASURED, never inferred from chip generation or OS
// version). Vocabulary IS the AcceleratorFacts record's (#422) — one facts schema, no second
// wire vocabulary. The torch-free worker NEVER fabricates these (it cannot measure them); until
// an executor qualifies the device, the accelerator is PRESENT-BUT-UNQUALIFIED and this message
// is absent from PlacementStatus.
message AcceleratorQualification {
  bool qualified = 1;
  repeated string capabilities = 2;  // sorted facts vocabulary (bf16, fp8_compute,
                                     // pinned_h2d_streams, non_blocking_safe,
                                     // attention_upcast_required); presence = measured true
  uint64 recommended_max_bytes = 3;  // the working-set envelope the ledger prices against
  uint64 pinned_capacity_bytes = 4;
  uint32 h2d_gbps_measured = 5;
  uint32 d2h_gbps_measured = 6;
  string torch_version = 7;          // TELEMETRY ONLY
  repeated string unreadable = 8;    // tri-state honesty
}

message ActivityEvent {
  uint64 seq = 1;
  string kind = 2;
  string step = 3;                   // bounded <= 256 bytes
  uint64 at_unix_ms = 4;
}

// ---------------------------------------------------------------------------
// Attempt offer / acceptance / cancellation / outcome.
// The attempt fence triple is (request_id, attempt_ordinal, invocation_spec_digest).
// placement_id is ROUTING: it names the executing placement, never invocation identity.
// ---------------------------------------------------------------------------

// Was StartAttempt (#481): receiving an OFFER begins VALIDATION, not execution, so refusing one
// is an ordinary outcome rather than an exception. EVERY offer receives either AttemptAccepted or
// a JOURNALED AttemptOutcome(REFUSED) — never silence.
message AttemptOffer {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;             // fence (a)
  uint64 attempt_ordinal = 6;        // fence (b); RecordOwner-bumped only. EVERY offer consumes
                                     // its ordinal — what a pre-execution refusal does not
                                     // consume is BUDGET (#480b; 02 §6's "only a proven decline
                                     // is non-consuming" is retired with the decline).
  bytes invocation_spec_digest = 7;  // fence (c), class (a): sha256 over EXACTLY the bytes in 9;
                                     // the receiver RECOMPUTES and refuses on mismatch
  DeliveryGrant grant = 8;           // expiring, refreshable; OUTSIDE the digest
  bytes invocation_spec_canonical_bytes = 9;  // the InvocationSpec DOCUMENT, canonical JSON
                                     // bytes; immutable for the attempt; parsed under
                                     // unknown-field REFUSAL
  string placement_id = 10;          // the target placement (serving mode; REQUIRED there, empty
                                     // in job mode); unknown id refuses
                                     // FAULT_KIND_UNKNOWN_PLACEMENT as a JOURNALED REFUSED
                                     // outcome
  uint64 admission_epoch = 12;       // the epoch the RecordOwner OBSERVED when it
                                     // dispatched. Stale refuses deterministically.
}

// ACCEPTANCE IS QUEUE ADMISSION (proto-026, gpu-hot D2): "journaled, hydrated, queued on
// lane_id". It binds neither a plan nor an executor epoch — both bind at DEVICE ENTRY and are
// OBSERVED on HeldAttempt (plan_digest from RUNNING on; executor_epoch, 0 while QUEUED). Plan
// facts ride the outcome body (AttemptMetrics).
message AttemptAccepted {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  // PRE-LAUNCH HARD CUT (proto-026): the four slots that bound plan and executor
  // epoch AT ACCEPTANCE are gone. No dual reading, no shim, no compatibility path: a RecordOwner
  // below 23 is below the floor and never served a second way. R7 tombstones — numbers
  // and names — so nothing can reuse them with a different meaning.
  reserved 8;                        // plan_digest — observed on HeldAttempt.plan_digest (14)
  reserved 9;                        // model_construction_digest — bound at device entry; the
                                     // contract is already named by the accepted PlacementSet
                                     // (Slot.model_construction_contract)
  reserved 10;                       // plan — plan facts ride the outcome body
  reserved 12;                       // executor_epoch — observed on HeldAttempt.executor_epoch
  reserved "plan_digest", "model_construction_digest", "plan", "executor_epoch";
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;  // echo
  string placement_id = 11;          // echo
  string lane_id = 13;               // proto-026: the DeviceLane the attempt was admitted to;
                                     // the same value its HeldAttempt row carries
}

// No placement_id here: the fence triple resolves against the journaled acceptance, which
// records the placement.
message CancelAttempt {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  CancelReason reason = 7;
  uint64 grace_ms = 8;               // operator override; 0 = worker default. Never author-set.
  bytes invocation_spec_digest = 9;  // full-triple fence; stale/mismatched cancel is DROPPED
}

// The envelope around a journaled AttemptOutcomeBody document — the ATTEMPT OUTCOME (was
// AttemptTerminal; "terminal" reads as a device and the thing is an outcome, #481). One
// immutable outcome per attempt; the customer-visible settlement is the RecordOwner's
// RequestClosure and never crosses this wire. Body travels as canonical bytes; routing copies
// must agree with it. journal-before-send applies unchanged, INCLUDING to refusals: the outcome
// is persisted before it is sent and replays until AttemptOutcomeAck.
message AttemptOutcome {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;             // routing copy; must agree with the document
  uint64 attempt_ordinal = 6;        // routing copy
  bytes invocation_spec_digest = 7;  // routing copy
  string outcome_id = 8;             // WORKER-minted observation id; stable across replays
  bytes outcome_digest = 9;          // class (a): sha256 over EXACTLY the bytes in 10
  bytes outcome_canonical_bytes = 10;  // the AttemptOutcomeBody DOCUMENT, canonical JSON bytes
  string placement_id = 11;          // routing
}

// DOCUMENT SHAPE (not a wire message): canonical form
// `cozy.worker.v1.AttemptOutcomeBody/1` (#480c/#481/th-049).
message AttemptOutcomeBody {
  string request_id = 1;
  uint64 attempt_ordinal = 2;
  string invocation_spec_digest = 3; // sha256:<hex> spelling inside the document
  OutcomeStatus status = 4;          // closed NEUTRAL vocabulary; retryability is a RecordOwner
                                     // PROJECTION over (status, cause, origin), unrepresentable
                                     // as a worker wire fact
  OutputManifest output_manifest = 5;
  AttemptMetrics metrics = 6;
  TriageBundleRef triage_bundle = 7; // observation only
  string safe_message = 8;           // bounded <= 4096 bytes, sanitized
  OutcomeCause cause = 9;            // REQUIRED
  ResultEnvelope result = 10;        // the typed function result (success outcomes)
  bool execution_started = 11;       // THE BILLING FACT, structural rather than derived from a
                                     // cause-code allowlist (#480c): false => the author never
                                     // ran and zero execution budget was billed, so the
                                     // RecordOwner may immediately mint attempt_ordinal + 1 and
                                     // dispatch it elsewhere with no cooldown and no budget draw
  repeated WeightsReceiptRef weights_receipts = 12; // committed job outputs only; sorted by slot
  ExecutionObservation observation = 13; // exact outcome-owned observation
}

// Carried exact bytes, not a structured duplicate. The receiver hashes 2, compares 1, then opens
// the canonical WeightsReceipt document. This reference is nested in AttemptOutcomeBody/1 and
// therefore has no format tag of its own.
message WeightsReceiptRef {
  bytes weights_receipt_digest = 1;
  bytes weights_receipt_canonical_bytes = 2;
}

// DOCUMENT SHAPE: canonical `cozy.worker.v1.WeightsReceipt/1`. TensorFS receipt bytes remain
// opaque to this protocol package; Runtime proves their digest before authoring this document.
message WeightsReceipt {
  reserved 8;
  reserved "checkpoint_evidence_canonical_bytes";
  string owner_authority_scope = 1;
  string request_id = 2;
  string invocation_spec_digest = 3;
  string output_slot = 4;
  string weights_transaction_id = 5;
  string tensorfs_receipt_digest = 6;
  bytes tensorfs_receipt_canonical_bytes = 7;
}

// ---------------------------------------------------------------------------
// ArtifactSink host exchange. These frames share WorkerControl so the supervisor can durably
// interpose between an authenticated RecordOwner and a stateless Runtime child. There is no
// second listener, socket, journal, or protocol. Runtime-facing messages below carry only semantic
// identities, canonical bytes, opaque source references, and bounded data chunks. They never
// carry a filesystem path, URL, credential, bucket, repository, release, or catalog destination.
// ---------------------------------------------------------------------------

// One produced TensorFS ObjectRef plus an opaque transaction-scoped reader token. source_ref uses
// `<namespace>:<token>` printable ASCII with no slash, backslash, URI, or filesystem semantics.
message WeightsObjectSource {
  string object_id = 1;
  uint64 length = 2;
  string source_ref = 3;
}

// Runtime commits semantic intent in its per-Store workspace before
// native writes, then sends this observation. requested_writer_epoch is the positive
// Runtime-assigned epoch; Host must project it exactly and never allocate another.
// The attempt ordinal is routing only and does not enter transaction identity.
// The TensorFS declaration is carried directly, or by reference above the inline bound: it is
// not wrapped in a second Worker Protocol document. Its digest and length are the durable
// conflict/replay fence.
message WeightsIntentFrame {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;
  string output_slot = 8;
  bytes tensorfs_declaration_digest = 9;
  uint64 requested_writer_epoch = 10;
  bytes tensorfs_declaration_canonical_bytes = 11;
  // Created only by Runtime. The host validates and durably binds this supplied ID to
  // owner/request/spec/slot, refuses conflicting bindings, and echoes it; it never hashes
  // a second transaction ID. Required lowercase sha256:<64 hex>.
  string weights_transaction_id = 12;
  // Exact byte length of the declaration. One over MaxWeightsDeclarationBytes rides by
  // reference: field 11 is empty, and this length with the digest names the declaration
  // Runtime's workspace journals. Required.
  uint64 tensorfs_declaration_length = 13;
}

// Runtime's workspace readiness reply and internal intent/receipt observation result.
// The Host only forwards Runtime-authored readiness replies; it never
// injects this message to authorize native writes. REFUSED grants no writer authority.
message WeightsHostAck {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;
  string output_slot = 8;
  string weights_transaction_id = 9;
  uint64 writer_epoch = 10;
  bytes tensorfs_declaration_digest = 11;
  WeightsHostStage stage = 12;
  WeightsHostOutcome outcome = 13;
  WeightsHostRefusal refusal = 14;
  WeightsReceiptRef weights_receipt = 15;
  Ref manifest = 16; // present exactly with weights_receipt; the produced Manifest identity
                     // downstream nodes consume without parsing opaque TensorFS receipt bytes
  CheckpointRef checkpoint = 17; // INTENT: natively validated restore head; CHECKPOINT: exact
                                // locally journaled progress. Neither asserts remote custody.
}

// Fixed-size TensorFS Link facts. No object inventory or model-growing role list rides here.
message CheckpointRef {
  Ref head = 1;
  bytes plan_digest = 2;
  uint64 index = 3;
  uint64 bytes = 4; // cumulative locally accepted bytes; not a remote durability receipt
}

// Runtime -> host -> authenticated owner, journaled under the existing weights intent before
// ACK. The owner banks this Link closure with CheckpointPage/Transfer and retains its own
// remotely acknowledged prefix separately from this locally observed progress.
message WeightsCheckpointFrame {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;
  string output_slot = 8;
  string weights_transaction_id = 9;
  uint64 writer_epoch = 10;
  bytes tensorfs_declaration_digest = 11;
  CheckpointRef checkpoint = 12;
}

// A current intent is registered and externally observable BEFORE writer ACK. The owner
// restores its banked Link under that intent's exact authority, then calls Ready once.
// An absent checkpoint explicitly chooses no external restore; verified local progress stays.
// Same intent/head replays; changed head conflicts. Cancellation tombstones even while waiting.
message WeightsIntentReadyRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  WeightsCheckpointSubject weights = 5;
  uint64 attempt_ordinal = 6;
  CheckpointRef checkpoint = 7;
}

// Loopback only: the host adds the exact TensorFS-authored declaration already held by its
// current intent. Runtime verifies its digest and native checkpoint closure before success.
// This never opens/fences/imports a writer. The host journals Ready and releases its existing
// INTENT ACK only after this synchronous verdict. Complete request <= MaxInlineControlBytes.
message ValidateWeightsCheckpointRequest {
  WeightsIntentReadyRequest intent = 1;
  bytes tensorfs_declaration_canonical_bytes = 2; // <= MaxWeightsDeclarationBytes
}

message ValidateWeightsCheckpointResult {
  WeightsCheckpointSubject weights = 1;
  CheckpointRef checkpoint = 2;
  bool valid = 3;
  string safe_code = 4;
  string safe_detail = 5;
}

// The Host refused to record ONE weights transaction frame (intent, checkpoint or receipt):
// a stale writer, a conflicting intent or receipt, or an invalid inventory. The refused frame
// is not forwarded and the transaction has no Host custody; the control stream and every other
// transaction and attempt continue. The owner's later WeightsTransfer of that receipt fails
// alone. Runtime stops the transaction's work and fails its attempt promptly with the detail
// instead of reporting an output the owner cannot collect.
message WeightsTransactionRefused {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;
  string output_slot = 8;
  string weights_transaction_id = 9;
  uint64 writer_epoch = 10;
  WeightsHostStage stage = 11;
  WeightsHostRefusal refusal = 12;
  string safe_detail = 13; // printable ASCII, <= 1024 bytes, naming the refusal and its recovery
}

// Runtime sends the exact committed receipt and exact local source inventory together. The
// supervisor validates all routing copies and writer_epoch, commits both before ACK, and then
// may forward this frame to the external RecordOwner. A stale child cannot publish a late receipt.
message WeightsReceiptFrame {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;
  string output_slot = 8;
  string weights_transaction_id = 9;
  uint64 writer_epoch = 10;
  bytes tensorfs_declaration_digest = 11;
  WeightsReceiptRef weights_receipt = 12;
  repeated WeightsObjectSource objects = 13; // sorted uniquely by object_id; committed in the
                                             // same host-ledger transaction as weights_receipt
  Ref manifest = 14; // exact produced TensorFS Manifest; it is also one row in objects
}

// Compact supervisor-ledger state included in WorkerSnapshotBody/1. A stateless replacement
// Runtime does not author these rows; pod-supervisor injects them before digesting the external
// snapshot. It MUST NOT put declarations, receipt bytes, or object inventory here. After the
// snapshot ACK, the supervisor replays each RECEIPT transaction's exact WeightsReceiptFrame.
message WeightsTransactionStatus {
  string weights_transaction_id = 1;
  string request_id = 2;
  uint64 attempt_ordinal = 3;
  string invocation_spec_digest = 4;
  string output_slot = 5;
  uint64 writer_epoch = 6;
  WeightsTransactionState state = 7;
  bytes tensorfs_declaration_digest = 8;
  bytes weights_receipt_digest = 9; // absent in INTENT; exact replay fence in RECEIPT
  CheckpointRef checkpoint = 10; // latest locally recorded progress, not remote custody
  bool intent_ready = 11; // the owner has finished restore (or explicitly chose no restore)
}

message WeightsObjectRef {
  string object_id = 1;
  uint64 length = 2;
}

message WeightsUploadHeader {
  string name = 1;
  string value = 2;
}

// A th-059 upload capability: ONE object, ONE PUT, ONE short expiry, pinned to the object's own
// digest by its signed checksum header and to first-write-wins by `if-none-match: *`. url
// includes the scoped query credential, is memory-only, and MUST NOT reach a log or the host
// ledger.
//
// The supervisor validates it against the durable receipt and then hands it to the process that
// HOLDS the bytes, which is Runtime. Relaying 8 GiB back through the supervisor 4 MiB at a time
// bought nothing: the capability is already scoped to one object, Runtime cannot widen it, and
// the object store -- not the relay -- is what enforces the signed checksum. Runtime already
// spends exactly this kind of capability for job outputs (`DeliveryGrant.outputs`).
message WeightsUploadGrant {
  string object_id = 1;
  uint64 length = 2;
  string url = 3;
  repeated WeightsUploadHeader required_headers = 4;
  uint64 expires_at_unix = 5;
}

// pod-supervisor -> Runtime. The supervisor has already bound this transfer to the durable
// receipt inventory and its ledger; this frame delegates the one thing it cannot do better than
// Runtime, which is stream bytes it does not have. Runtime PUTs to the granted URL and answers
// with WeightsUploadResult. It is the supervisor's ledger, not this frame, that decides what
// was written -- custody is recorded before the writer opens and again when it closes.
message WeightsUploadRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string weights_transaction_id = 5;
  uint64 writer_epoch = 6;
  string object_id = 7;
  string source_ref = 8;
  uint64 length = 9;
  string operation_id = 10;
  uint64 grant_revision = 11;
  WeightsUploadGrant grant = 12;
}

// Runtime -> pod-supervisor. One terminal answer per WeightsUploadRequest. checksum_sha256 is
// what Runtime measured while streaming; the supervisor compares it to the durable ObjectRef,
// and the store independently enforced the same digest through the grant's signed checksum
// header, so neither party is trusted alone.
message WeightsUploadResult {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string weights_transaction_id = 5;
  uint64 writer_epoch = 6;
  string object_id = 7;
  string operation_id = 8;
  uint64 grant_revision = 9;
  WeightsUploadOutcome outcome = 10;
  uint64 transferred_bytes = 11;
  uint32 http_status = 12;
  string etag = 13;
  string checksum_sha256 = 14; // lowercase sha256:<64 hex> measured while streaming
  WeightsUploadRefusal refusal = 15;
  string safe_detail = 16;
}

// Creator resolves and pins provider metadata. One selected file capability at a time reaches
// pod-supervisor; Runtime performs TensorFS's bounded profile/header proof before all payloads
// arrive, then converts only operations whose physical carriers are verified. URL is memory-only; the ledger
// stores only stable identity/revision and measured progress. A higher capability_revision may
// refresh access but cannot change member/ObjectRef/source selection. Broad account tokens are not
// representable.
message ModelSourceFileRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string operation_id = 5;
  bytes source_selection_digest = 6;
  string member = 7;
  string object_id = 8; // lowercase sha256:<64 hex>
  uint64 length = 9;
  ModelSourceProvider provider = 10;
  // Empty declares header metadata only and returns ACCEPTED without downloading. The
  // owner declares every roster header first, restores an acknowledged checkpoint, then
  // grants nonempty URLs only for the physical carriers TensorFS still needs.
  string url = 11; // memory-only access; never echoed in status/snapshot/loopback
  uint64 expires_at_unix = 12; // zero only for an immutable public URL
  uint64 capability_revision = 13;
  // Exact safetensors 8-byte LE length + header JSON, or full JSON for an index carrier.
  // One bounded header per file frame; never the model's entire header corpus in one frame.
  // <= MaxModelSourceHeaderBytes AND the complete frame <= MaxInlineControlBytes.
  bytes header = 14;
}

message ModelSourceFileStatus {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string operation_id = 5;
  bytes source_selection_digest = 6;
  string member = 7;
  string object_id = 8;
  uint64 length = 9;
  uint64 capability_revision = 10;
  ModelSourceFileState state = 11;
  uint64 transferred_bytes = 12;
  uint32 attempts = 13;
  string safe_code = 14;
  string safe_detail = 15;
}

// The complete selected roster and its headers are fixed before conversion. Runtime advances
// every descriptor-reviewed profile over the currently verified physical carriers and returns
// INCOMPLETE until every target is available. Pinned source URI and declared license are
// credential-free provenance, not authorization. This replaces the pre-release full-file barrier;
// deploy the generated schema and all consumers together.
message ModelSourcePrepareRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string operation_id = 5;
  bytes source_selection_digest = 6;
  repeated ModelSourceProfile profiles = 7; // sorted unique by slot
  string source_uri = 8; // credential-free pinned provenance
  string declared_license = 9; // bounded printable provenance; empty means undeclared
  repeated ModelSourceCheckpoint checkpoints = 10; // sorted unique acknowledged durable heads
}

message ModelSourcePrepared {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string operation_id = 5;
  bytes source_selection_digest = 6;
  ModelSourcePrepareOutcome outcome = 7;
  repeated PreparedModelSource sources = 8; // sorted unique completed slots; exact set when complete
  string safe_code = 9;
  string safe_detail = 10;
  repeated ModelSourceCheckpoint checkpoints = 11; // sorted unique locally checkpointed progress
}

// Durable progress/terminal observation for one exact uploaded file. Exact replay of an already
// verified prefix returns the same received byte count; changed identity under one operation
// refuses. A RECEIVING status carrying a safe code is a resumable stall: the owner replays the
// upload header to learn the resume offset.
message LocalPackageFileStatus {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string operation_id = 5;
  reserved 6;
  reserved "source_digest";
  reserved 9;
  reserved "kind";
  bytes digest = 7;
  string filename = 8;
  uint64 length = 10;
  LocalPackageFileState state = 11;
  uint64 received_bytes = 12;
  string safe_code = 13;
  string safe_detail = 14;
}

// Durable owner->worker request. This is a typed protobuf frame, not a canonical document. The
// record owner journals the decision fields before send; Runtime journals the result fields
// before reply. Replay keys on the request tuple and compares the typed fields.
message WeightsFinalizeRequest {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  bytes invocation_spec_digest = 6;
  string output_slot = 7;
  WeightsFinalizeDisposition disposition = 8;
  bytes weights_receipt_digest = 9;
  string scratch_root_id = 10;
  string owner_authority_scope = 11;
  // Exact already-owned InvocationSpec/1 bytes, required and SHA-bound to field6.
  // Runtime re-validates canonical form and the declared model output even after its
  // ephemeral attempt history is gone. This is existing authority, never a new identity.
  // The complete request must remain within MaxInlineControlBytes.
  bytes invocation_spec_canonical_bytes = 12;
}

// Durable worker->owner result. A commit-first ABANDON_UNCOMMITTED race carries the released
// receipt as evidence; other outcomes may omit it. No extra acknowledgement exists.
message WeightsFinalizeResult {
  reserved 4;
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  bytes invocation_spec_digest = 6;
  string output_slot = 7;
  WeightsFinalizeOutcome outcome = 8;
  WeightsReceiptRef weights_receipt = 9;
  string owner_authority_scope = 10;
}

message ResultEnvelope {
  reserved 6;                        // adapters (AppliedAdapter) — no writer; the adapter echo
                                     // lands with cr-010 (post-launch), keyed by
                                     // resolved_adapter_plan_id
  bytes result_schema_digest = 1;
  bytes inline_result = 2;           // canonical typed result bytes, <= 4 MiB; XOR with 3
  OutputEntry result_blob = 3;       // by immutable blob receipt when large; XOR with 2
  repeated AdjustmentRow adjustments = 4;
  string checkpoint_ref = 5;
  repeated RetainedModelResult retained_models = 7; // <=32, sorted by result_pointer
}

// A schema-declared ModelArtifact returned directly or borrowed from a child.
// This entry is inside the exact hashed terminal, never an unbound post-hoc lookup.
message RetainedModelResult {
  string result_pointer = 1; // RFC6901 JSON pointer, <=1024 UTF-8 bytes; empty means root
  bytes model_artifact_canonical_bytes = 2; // <=4096 bytes, exact closed ModelArtifact value
  DerivedRetentionRequest retention = 3; // actual producer transaction/receipt and root-held lease
  // Runtime must establish native custody before terminal commit and verify the
  // pointer names this exact artifact under the declared result schema. Receivers
  // verify all entries before adopting independent custody and acknowledging the
  // terminal. Never derive native transaction IDs from public artifact fields.
}

message AdjustmentRow {
  string field = 1;
  string requested = 2;
  string applied = 3;
  string reason = 4;                 // adjusted | clamp | warn, plus bounded detail
}

message OutcomeCause {               // was TerminalCause
  CauseCode code = 1;
  CauseOrigin origin = 2;
  string detail = 3;                 // bounded <= 1024 bytes, sanitized
  ResourceShortfall shortfall = 4;
}

message ResourceShortfall {
  string resource = 1;               // device_memory | host_ram | pinned | disk | ...
  string scope = 2;
  uint64 needed_bytes = 3;
  uint64 available_bytes = 4;
  string request_shape = 5;
  string evidence_class = 6;         // measured | fitted | prior
}

message AttemptOutcomeAck {          // was TerminalAck
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  bytes invocation_spec_digest = 7;
  string outcome_id = 8;             // echo; a mismatched ack is NOT an ack — replay continues
  bytes outcome_digest = 9;          // echo; compared, never recomputed
  // Close this attempt while retaining its request-scoped writer identity,
  // epochs and artifact custody for pause/retry. Does not authorize further execution.
  // The owner sends false only after permanent abandonment or required final custody
  // and disposition have settled. Native roots are still controlled by their explicit
  // finalization/source-release operations; this flag never adopts or deletes bytes.
  bool retain_work = 10;
}

// ---------------------------------------------------------------------------
// Job checkpoint exchange (unchanged in substance; live in the jobs chain)
// ---------------------------------------------------------------------------

message JobCheckpointRequest {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  string operation_key = 7;          // worker-minted, attempt-scoped idempotency key
  string logical_key = 8;            // author-stable checkpoint slot
  bytes content_digest = 9;          // class (b): the checkpoint artifact's bytes
  uint64 seq = 10;                   // ordering only, never identity
  OutputEntry artifact = 11;
}

// ---------------------------------------------------------------------------
// WatchProgress — the one lossy lane
// ---------------------------------------------------------------------------

message ProgressOpen {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;   // binds the watch to the fenced control stream
  string worker_boot_id = 3;
  string request_id = 5;             // empty = all attempts on this stream
}

message AttemptProgress {
  reserved 4;                        // executor_incarnation — retired from the envelope (#446)
  uint64 record_owner_epoch = 1;
  uint64 control_stream_epoch = 2;
  string worker_boot_id = 3;
  string request_id = 5;
  uint64 attempt_ordinal = 6;
  uint64 seq = 7;                    // starts at 1, strictly increasing per (request_id,
                                     // attempt_ordinal); gaps are VISIBLE and the only loss
                                     // allowed
  string content_type = 8;
  bytes data = 9;                    // bounded <= 65536 bytes; NEVER an outcome
  string placement_id = 10;          // routing
}

// ---------------------------------------------------------------------------
// InvocationSpec / DeliveryGrant — immutable invocation meaning vs refreshable access. UNCHANGED
// in substance by this rev (rev §11): input identities, payload digest, and output contracts
// live INSIDE the digested document; the grant carries ACCESS only. A refresh may change access
// authority but never the subject being accessed.
// ---------------------------------------------------------------------------

// DOCUMENT SHAPE (not a wire message): the subject of `invocation_spec_digest`. Canonical form
// `cozy.worker.v1.InvocationSpec/1`. No human model/adapter ref is spellable. Readers ignore
// unknown keys; a result-changing key is sent only to peers advertising its capability.
// placement_id is DELIBERATELY absent: the same invocation is the same work wherever it routes.
message InvocationSpec {
  reserved 1, 3;
  reserved "package_revision_digest", "package_release_id", "config_digest";
  reserved 2;
  reserved "environment_digest";
  string payload_digest = 4;         // class (a): the canonical typed-argument document
  repeated InputBinding inputs = 5;  // ORDERED input identities — INSIDE the digest
  repeated OutputBinding outputs = 6;  // output ids/kinds/limits — INSIDE the digest
  uint64 deadline_unix_ms = 7;       // absolute attempt deadline; worker-enforced; 0 = none
  oneof spec {
    ServingInvocationSpec serving = 8;
    JobInvocationSpec job = 9;
  }
  ActivationCapture capture = 10; // immutable requested capture semantics
  // The execution-path override (cr-125). The attention kernel this attempt
  // pins, by `attention.BY_NAME`; empty leaves the runtime's own selection alone. INSIDE
  // the digest: it changes what the attempt computes. A pin the worker cannot honour is a
  // typed refusal, never a quiet fallback, so a non-empty value here is a fact about what ran.
  string attention_kernel = 11;
  string installation_id = 12; // routing/lifetime only; never an operation memoization input
}

message InputBinding {
  string input_id = 1;               // the payload field path, list index included
  string digest = 2;                 // class (b), sha256:<hex>: the input asset's content
  uint64 length = 3;
  string kind_mime = 4;
  uint32 order = 5;
}

message OutputBinding {
  string output_id = 1;
  string mime_type = 2;
  uint64 max_bytes = 3;
}

message ServingInvocationSpec {
  string entrypoint_binding_digest = 1;    // class (a): selected entrypoint binding identity
  string attempt_binding_id = 2;           // equal to field 1 when no adapters
  // REQUIRED: exact activated Placement.bindings_digest over canonical
  // {entrypoints,models}. Pins the selected model manifests as well as the entrypoint.
  // This is per placement, not the digest of unrelated co-fitting placements.
  string bindings_digest = 3;
}

message JobInvocationSpec {
  reserved 1;
  reserved "build_id";
  string job_descriptor_id = 2;
  PublicationContract publication_contract = 3;
  string installation_id = 4;
}

// Refreshable ACCESS, strictly PER-ATTEMPT: urls, token, expiry — and the invocation it serves.
// Nothing else. Pre-attempt placement acquisition does not ride this per-attempt grant.
message DeliveryGrant {
  bytes invocation_spec_digest = 1;  // the subject this grant serves; revalidated on refresh
  DeliveryAccessCredential credential = 2;  // per-attempt scoped capability token
  string file_base_url = 3;
  uint64 expires_at_unix = 4;
  repeated InputAccess inputs = 5;   // sorted by input_id; ids must match the spec's set
  repeated OutputAccess outputs = 6; // sorted by output_id
}

// Access provenance only; digest and length remain exclusively in InputBinding.
message CatalogModelSource {
  string repository = 1; // canonical org/name; no release, lane, query or fragment
}

message InputAccess {
  string input_id = 1;
  string url = 2;                    // presigned download URL
  // Exactly one of url and native_tree. The paired InputBinding names
  // the payload member's digest/length for a file, or the manifest for a Tree.
  // The source content_bytes is a quota fact, never an object byte length.
  NativeByteRetentionRequest native_tree = 3;
  // Only model:<parameter>, with its existing model:// URL and exact
  // model-manifest InputBinding. Mutually exclusive with native_tree. Runtime
  // verifies native repository membership once, then holds the exact checkpoint.
  CatalogModelSource catalog_model = 4;
}

message OutputAccess {
  string output_id = 1;
  string url = 2;                    // presigned upload URL
}

// ---------------------------------------------------------------------------
// Shared sub-messages
// ---------------------------------------------------------------------------

message DeliveryAccessCredential {   // was Credential (#481: say what it authorizes)
  string issuer = 1;
  string key_id = 2;
  uint64 credential_epoch = 3;
  uint64 expires_at_unix = 4;
  bytes token = 5;                   // STRUCTURALLY SECRET; never in a digest, a log, or an
                                     // ObservedWorkerState
}

message ResourceCaps {
  bool device_required = 1;
  uint64 max_device_memory_bytes = 2;
  uint64 max_rss_bytes = 3;
  uint64 max_disk_bytes = 4;
}

message PublicationContract {
  repeated OutputBinding outputs = 1;  // sorted by output_id
  string grant_id = 2;
}

// Torch-free worker-measurable STATICS (NVML / sysctl / OS facts), sent once at ClaimAck and
// never re-sent. Accelerator-neutral (#446): backend + memory_model use the AcceleratorFacts
// vocabulary (#422/#423). The worker never fabricates capability facts — a discovered
// accelerator is PRESENT-BUT-UNQUALIFIED until a placement executor qualifies it
// (PlacementStatus.accelerator). torch_version is gone from here: a torch-free process cannot
// honestly report one.
message WorkerResources {
  string platform = 1;               // os/arch, e.g. linux/amd64, windows/amd64, darwin/arm64
  string backend = 2;                // cuda | mps; "" = no accelerator discovered
  string memory_model = 3;           // discrete | unified — the ledger's PRICING MODEL selector
  uint32 device_count = 4;
  string device_name = 5;
  uint64 device_memory_total_bytes = 6;  // per device
  string driver_version = 7;
  string backend_version = 8;        // CUDA toolkit version; macOS/Metal version on mps
  uint64 host_ram_total_bytes = 9;
  uint32 vcpu_count = 10;
  uint64 disk_total_bytes = 11;
  uint32 power_cap_watts = 12;
  string partition_profile = 13;     // device partition (NVIDIA MIG on cuda); empty = whole
                                     // device
  string interconnect = 14;
  bool peer_access = 15;
  repeated string unreadable = 16;   // tri-state honesty: unreadable is distinct from zero
}

message JobCapacity {
  reserved 3;                        // free_vram_bytes — headroom byte counts retired (#441,
                                     // #446); jobs_available IS the credit
  uint32 jobs_in_flight = 1;
  uint32 jobs_available = 2;
  uint64 free_disk_bytes = 4;
  uint32 orchestration_in_flight = 5;
  uint32 orchestration_available = 6;
}

// Was ActiveAttempt (#481): the set holds unacked OUTCOMES too, and those are not active. At
// (proto-026) it holds QUEUED attempts too: every accepted attempt appears here from
// admission to ack, so the orchestrator's records are exact from the observed queue and a
// queued attempt is never absent. Lane, order and fairness are worker facts the orchestrator
// RENDERS, never sets: the worker orders its lane (gpu-hot.md §4), the orchestrator offers depth.
message HeldAttempt {
  string request_id = 1;
  uint64 attempt_ordinal = 2;
  AttemptKind kind = 3;
  AttemptState state = 4;
  bytes invocation_spec_digest = 5;
  string placement_id = 6;           // the executing placement; empty in job mode
  uint64 executor_epoch = 7;         // the epoch it runs/ran under; 0 while QUEUED — a queued
                                     // attempt is bound to no executor and survives a respawn
  string outcome_id = 8;             // set iff state is OUTCOME_PENDING_ACK
  bytes outcome_digest = 9;          // class (a); set iff state is OUTCOME_PENDING_ACK
  string lane_id = 10;               // proto-026: the DeviceLane this attempt is queued on,
                                     // running on, or ran on; empty in job mode
  uint32 queue_position = 11;        // the worker's CURRENT order among this lane's QUEUED
                                     // attempts: 0 = next on the device. Meaningful only while
                                     // QUEUED; 0 otherwise. Re-derived at every device entry.
  uint32 overtaken = 12;             // times a later-admitted attempt entered the device ahead
                                     // of this one; monotone for the attempt's life
  uint32 overtake_budget = 13;       // = the attempt's queue position at ADMISSION, the most it
                                     // may be overtaken; spent => picked before any class.
                                     // A count the queue itself yields, never a constant or env.
  bytes plan_digest = 14;            // class (a): AttemptPlan (cr-007), bound at DEVICE ENTRY;
                                     // set from RUNNING on, empty while QUEUED
}

message Fault {
  FaultKind kind = 1;
  string subject = 2;                // the placement_id, subject digest, or machine facet
  string reason = 3;                 // bounded <= 1024 bytes
  string detail = 4;                 // bounded <= 1024 bytes
  // The DesiredWorkerState revision this fault refuses: Runtime's verdict on an unapplied
  // revision, which never advances accepted_desired_state_revision. 0: not such a refusal.
  uint64 desired_state_revision = 5;
}

message OutputManifest {
  reserved 2;                        // was `bytes digest` (8d90461-era); retired, never reuse (R7)
  string publication_receipt_digest = 1;  // class (a), sha256:<hex>: the PublicationReceipt's
                                     // canonical digest (#420). Was `manifest_id` — the frozen
                                     // proto's own comment said what it carries and the field
                                     // name claimed otherwise (#481/#486).
  repeated OutputEntry outputs = 3;  // sorted by output_id
}

message OutputEntry {
  string output_id = 1;
  bytes digest = 2;                  // class (b)
  uint64 length = 3;
  string mime_type = 4;
  // Optional only for ordinary byte outputs committed in native custody.
  // digest/length remain the actual file, or actual manifest for a Tree output.
  NativeByteTreeRef native_tree = 5;
}

message AttemptMetrics {
  uint64 runtime_ms = 1;
  uint64 queue_ms = 2;
  uint64 peak_device_memory_bytes = 3;
  uint64 rss_at_end_bytes = 4;
  uint32 output_count = 5;
  uint64 input_tokens = 6;           // analytics at launch, never settlement input
  uint64 output_tokens = 7;
  uint64 device_lease_ms = 8;        // worker-attested: device ENTRY -> device RELEASE (the
                                     // executor's invoke reply, gpu-hot.md §3). The encode is
                                     // EXCLUDED at minor 23 — it is post_ms — so this is the
                                     // device phase and nothing else.
  uint32 device_count = 9;
  uint64 handler_ms = 10;
  uint64 finalization_ms = 11;
  repeated string unverified_fields = 12;
  uint64 post_ms = 13;               // proto-026: device release -> outcome sent — the post
                                     // phase (encode, digest, write + fsync, outcome build);
                                     // CPU, no device, no executor
  uint64 working_peak_device_bytes = 14;  // max over ranks of (allocator peak -
                                     // allocated at device entry)
  string shape_cell = 15;            // Runtime plan.shape_cell(features)
}

message TriageBundleRef {
  reserved 2;                        // was `bytes write_receipt` (moved to 4); retired, never reuse (R7)
  string subject_id = 1;
  bytes write_receipt_digest = 4;    // class (a)
  uint64 length = 3;                 // bounded <= 1048576 bytes
}

// ---------------------------------------------------------------------------
// Enums. Type-prefixed values; NUMBERS are normative.
// ---------------------------------------------------------------------------

enum Posture {
  POSTURE_UNSPECIFIED = 0;
  POSTURE_ACCEPTING = 1;
  POSTURE_DRAINING = 2;
}

// Machine lifecycle, pulled out of the placement enum (#482).
enum WorkerPhase {
  WORKER_PHASE_UNSPECIFIED = 0;
  WORKER_PHASE_BOOTING = 1;
  WORKER_PHASE_ONLINE = 2;
  WORKER_PHASE_DRAINING = 3;
  WORKER_PHASE_FAILED = 4;
}

// Axis 1 of a placement's convergence: what is on disk.
enum MaterializationState {
  MATERIALIZATION_STATE_UNSPECIFIED = 0;
  MATERIALIZATION_STATE_ABSENT = 1;
  MATERIALIZATION_STATE_MATERIALIZING = 2;
  MATERIALIZATION_STATE_STAGED = 3;      // asserts the installed receipt digest MATCHED
  MATERIALIZATION_STATE_FAILED = 4;
}

// Axis 2 of a placement's convergence: what it will take. "prepared"/"warming"/"ready" are
// RETIRED as state words (#482) — "warm" had five meanings across these documents (page cache,
// resident weights, a live process, an accepting placement, a model that has run once) and the
// axes now name exactly one thing each.
enum ServingState {
  SERVING_STATE_UNSPECIFIED = 0;
  SERVING_STATE_OFFLINE = 1;
  SERVING_STATE_ACTIVATING = 2;
  SERVING_STATE_DISPATCHABLE = 3;   // executor started and package imported; models load on demand
  SERVING_STATE_DRAINING = 4;
}

// The worker-level admission fence (§6). CLOSED is STRUCTURAL; OPEN with zero
// available_attempt_slots is TRANSIENT saturation (#486c). Both refuse under
// CAUSE_CODE_NO_CAPACITY, and a RecordOwner backs off differently for each.
enum AdmissionState {
  ADMISSION_STATE_UNSPECIFIED = 0;
  ADMISSION_STATE_OPEN = 1;
  ADMISSION_STATE_CLOSED = 2;
}

enum AttemptKind {
  ATTEMPT_KIND_UNSPECIFIED = 0;
  ATTEMPT_KIND_SERVING = 1;
  ATTEMPT_KIND_JOB = 2;
}

// The lane order (proto-026, gpu-hot.md §3): QUEUED -> RUNNING -> DEVICE_RELEASED ->
// OUTCOME_PENDING_ACK. Numbers are the normative part; they are not in phase order.
enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_RUNNING = 1;               // the DEVICE phase: plan priced, executor bound,
                                           // on the device — THE seat of its lane
  ATTEMPT_STATE_OUTCOME_PENDING_ACK = 2;   // was TERMINAL_PENDING_ACK
  // #507d: the attempt is HELD but its journal record is not durable. The frozen wire could
  // only say this as RUNNING + a LOCAL_SAFETY fault compound — honest, but compound.
  ATTEMPT_STATE_HELD_UNDURABLE = 3;
  ATTEMPT_STATE_QUEUED = 4;                // accepted into the lane queue, hydrated, bound to
                                           // no executor (executor_epoch 0, plan_digest empty)
  ATTEMPT_STATE_DEVICE_RELEASED = 5;       // the device phase is over (executor replied, bytes
                                           // in the spool, ledger row closed); the post phase is
                                           // running or the outcome is not yet sent. Nothing
                                           // done to the executor from here can touch it.
}

