  CLAIM_REJECTION_UNSPECIFIED = 0;
  CLAIM_REJECTION_UNAUTHENTICATED = 1;            // proof failure; checked before readiness/state
  CLAIM_REJECTION_STALE_RECORD_OWNER_EPOCH = 2;  // epoch older than the accepted claim
  CLAIM_REJECTION_EPOCH_HELD = 3;                // equal epoch, different record_owner_id
  CLAIM_REJECTION_WORKER_ID_MISMATCH = 4;
